# HPC Job Dashboard 配置文件
#
# clusters 下每一项对应一个 Slurm 集群。ssh_host 建议使用你 ~/.ssh/config 里
# 已经配置好的 Host 别名（这样 ProxyJump / IdentityFile / 端口跳板机等设置
# 都会自动生效，不用在这里重复配置）。
#
# 例如你的 ~/.ssh/config 里有：
#   Host clusterA
#       HostName login.clusterA.example.edu
#       User yourname
#       ProxyJump bastion
# 那这里 ssh_host 就填 clusterA。
#
# 前提：能用 SSH key 登录（key + agent，或者 key 没加密码）。这个程序不会替你
# 输入密码 / 2FA 验证码。像 sulis 这种 "key + 2FA" 的集群：2FA 还在有效期内时
# 能正常用；过期了网页上会显示"需要 2FA"，在终端里手动 ssh 登录一次再点"立即刷新"。
#
# backlog（可选）：设成 false 就不对这个集群做排队积压估计（默认开）。

#
# qos（可选）：想在 QoS 面板里看哪些 QoS。不写的话会自动用
#   sacctmgr show assoc user=$USER format=qos
# 查到你能用的 QoS；不管写没写，你当前 job 实际用到的 QoS 都会自动补上。
# 可以直接写名字，也可以写成 {name, note} 加一句备注（显示在 QoS 名字下面）。

clusters:
  - name: ClusterA          # 显示用的名字，随便起
    ssh_host: clusterA      # ssh_host 对应 ~/.ssh/config 里的 Host
    enabled: true
    # qos:
    #   - freecpu
    #   - name: freegpu
    #     note: GPU，最长 2 天

  - name: ClusterB
    ssh_host: clusterB
    enabled: true

  # 用完就删或者 enabled: false
  # - name: OldSGE
  #   ssh_host: sge-login
  #   enabled: false

# 刷新方式：默认不自动刷新，网页上点"立即刷新"才去 SSH 拉数据。
# 网页和 SSH 是解耦的：打开网页立刻显示上一次的数据（存在 .dashboard_cache.json），
# 刷新 / 读目录都在后台按顺序一个个执行，网页上方有进度条。
# auto_refresh_minutes：>0 就每隔这么多分钟自动刷新一次；0 = 不自动刷新
auto_refresh_minutes: 0
# 启动 app.py 时要不要先刷新一次（没有缓存的时候总会刷新一次）
refresh_on_start: false

# 展开 job 时读取它的工作目录：ls 一下，再对下面每个模式取最新的匹配文件
# tail 最后几行并解析（VASP 的离子步 / 能量 / 收敛 / 报错）。{id} 会换成 job id。
inspect_files:
  - vasp.out
  - "Slab*.log"
  - "*{id}*.out*"      # slurm 的输出文件，比如 VASP_GPU-87704.out.txt
inspect_tail_lines: 30
# 读目录时顺便 du 一下大小，超过这么多 GB 就在界面顶部的"提醒"里报警
dir_size_warn_gb: 30
# du 的超时（秒），lustre 上目录很大时 du 可能很慢；设 0 = 不查大小
dir_size_timeout_seconds: 20

# sacct 往前查多少小时的历史作业（用来把已经跑完/失败的 job 也显示出来，
# 这样同名 job / 依赖链里前面已经结束的那些也能看到最终状态）。
history_hours: 48

# QoS 面板里"全集群"那一列：每轮额外跑一次 squeue（所有用户）统计每个 QoS 的
# 运行/排队数，看哪个 QoS 比较空。有的集群只让看自己的 job，会自动显示"隐藏"。
show_cluster_load: true

# QoS 列表和限额（sacctmgr）基本不变，多少分钟重新查一次
qos_info_refresh_minutes: 30

# 排队积压估计（从 godot.py 移植）：要拉全集群的 squeue + sinfo，比较重，
# 隔几分钟才拉一次。backlog: false 可以全局关掉。
backlog: true
backlog_refresh_minutes: 5

# 开了自动刷新时：集群要求输入 2FA/密码后，多少分钟之后再自动试一次（"立即刷新"会马上重试）。
# 不会发送任何验证码，只是再连一次看看 2FA 是否已经在别处验证过了。
auth_retry_minutes: 10

# 等待时间数据收集：每次刷新把每个 job 的请求资源、第一次看到它排队时的集群状态、
# 最终等了多久写进 waitlog_dir 下的 csv（相对 app.py 所在目录），以后用来建预测模型
waitlog: true
waitlog_dir: waitlog

# SSH 单次命令超时（秒）
ssh_timeout_seconds: 15

# Flask 监听地址和端口
# 只在本机用：127.0.0.1（默认，更安全）
# 想在同一局域网内用手机/其他机器打开：改成 0.0.0.0（注意：job名字等信息就暴露在局域网了）
host: 127.0.0.1
port: 8787
