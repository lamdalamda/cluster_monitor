<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HPC Job Dashboard</title>
<style>
  :root{
    --bg:#0f1117; --panel:#161922; --panel2:#1b1f2a; --border:#2a2e3a; --text:#e6e8ee; --muted:#8b90a0;
    --accent:#5b8def; --row-hover:#1e2330; --child:#12151d;
    --ok:#2ecc71; --warn:#f1c40f; --bad:#e74c3c;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);font-size:13px;}
  header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--border);background:var(--panel);flex-wrap:wrap;}
  header h1{font-size:15px;margin:0 6px 0 0;font-weight:600;}
  .muted{color:var(--muted);font-size:12px;}
  .spacer{flex:1;}
  select,input[type=text]{background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:5px 9px;font-size:13px;}
  input[type=text]{width:220px;}
  button{background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:5px 11px;font-size:13px;cursor:pointer;}
  button:hover{border-color:var(--accent);}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  main{padding:14px 16px 40px;}
  h2{font-size:13px;font-weight:600;margin:0 0 8px;color:var(--muted);display:flex;align-items:center;gap:8px;}
  h2 button{font-size:11px;padding:1px 8px;}
  h2 .muted{font-weight:400;}
  .errbox{background:#3a1f1f;border:1px solid #6b2b2b;color:#ff9d9d;padding:7px 10px;border-radius:6px;margin-bottom:12px;font-size:12px;}
  .errbox div{word-break:break-all;}

  /* QoS 面板 */
  #qosGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(520px,1fr));gap:12px;margin-bottom:18px;}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:8px;overflow-x:auto;}
  .card-h{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--border);font-weight:600;}
  .card-h .muted{font-weight:400;}
  .card-err{padding:10px 12px;color:#ff9d9d;font-size:12px;word-break:break-all;}
  table{border-collapse:collapse;width:100%;}
  th{font-weight:500;color:var(--muted);text-align:left;font-size:12px;padding:6px 10px;border-bottom:1px solid var(--border);white-space:nowrap;background:var(--panel);}
  td{padding:5px 10px;border-bottom:1px solid var(--border);white-space:nowrap;vertical-align:middle;}
  .qos td{font-variant-numeric:tabular-nums;}
  .qos tbody tr{cursor:pointer;}
  .qos tbody tr:hover{background:var(--row-hover);}
  .qos tr.sel{background:#22304d;}
  .qos tr.idle td.qname{color:var(--muted);}
  .qos .note{display:block;color:var(--muted);font-size:11px;white-space:normal;}
  .qos .lim{color:var(--muted);}
  .qos .tres{white-space:normal;word-break:break-all;min-width:110px;font-size:12px;}
  .qos tr.full td.mine{color:var(--warn);}
  .qos tr.subfull td.mine{color:var(--bad);}
  .n-r{color:var(--ok);} .n-pd{color:var(--warn);} .n-0{color:#4a5063;}
  .tag{display:inline-block;font-size:10px;padding:0 5px;border-radius:3px;margin-left:5px;vertical-align:1px;}
  .tag.full{background:#4a3b10;color:var(--warn);} .tag.subfull{background:#4a1c1c;color:#ff9d9d;}
  .tag.cfg{background:#1f2c48;color:#9db8f5;}

  /* Job 表格 */
  .tablewrap{background:var(--panel);border:1px solid var(--border);border-radius:8px;overflow-x:auto;}
  #jobs th{position:sticky;top:0;}
  #jobs tbody tr.grp:hover, #jobs tbody tr.one:hover{background:var(--row-hover);}
  #jobs tr.child{background:var(--child);}
  #jobs tr.child td{border-bottom-color:#1d212b;}
  #jobs tr.child:has(+ tr.detail) td{border-bottom:none;padding-bottom:2px;}
  #jobs tr.child td.name{padding-left:28px;color:var(--muted);}
  #jobs tr.flash{animation:flash 1.6s ease-out;}
  @keyframes flash{0%{background:#2c4a80;}100%{background:transparent;}}
  td.tog{width:26px;padding:0 0 0 10px;color:var(--muted);cursor:pointer;user-select:none;}
  tr.grp td{cursor:pointer;}
  .tri{display:inline-block;transition:transform .12s;font-size:10px;}
  .open .tri{transform:rotate(90deg);}
  td.name{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;max-width:420px;overflow:hidden;text-overflow:ellipsis;}
  .count{color:var(--muted);font-family:inherit;font-size:11px;margin-left:6px;}
  td.jid{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;cursor:copy;}
  td.jid:hover{color:var(--accent);}
  td.part{max-width:180px;overflow:hidden;text-overflow:ellipsis;color:var(--muted);}
  td.where{max-width:260px;overflow:hidden;text-overflow:ellipsis;}
  td.num{font-variant-numeric:tabular-nums;}
  .st{display:inline-block;padding:1px 7px;border-radius:10px;font-size:11px;font-weight:600;color:#111;background:var(--c);}
  .st.light{color:#fff;}
  .cnts{margin-left:6px;}
  .cnt{display:inline-block;font-size:10px;padding:0 5px;margin-right:3px;border-radius:3px;border:1px solid var(--c);color:var(--c);font-variant-numeric:tabular-nums;}
  .dep{display:inline-flex;align-items:center;gap:4px;margin-right:8px;cursor:pointer;color:var(--muted);}
  .dep:hover{color:var(--accent);}
  .dep b{font-weight:400;color:var(--text);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--c);flex:none;}
  .empty{padding:24px;text-align:center;color:var(--muted);}
  /* 排队积压 */
  #blGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(520px,1fr));gap:12px;margin-bottom:18px;}
  .bl td{font-variant-numeric:tabular-nums;}
  .bl tr.mine{background:#1d2436;}
  .h-ok{color:var(--ok);} .h-mid{color:var(--warn);} .h-bad{color:#ff7b6b;}
  .gpuv{margin-right:10px;white-space:nowrap;}
  .gpuv .t{color:var(--muted);font-size:11px;}
  .card-foot{padding:7px 12px;font-size:12px;color:var(--muted);border-top:1px solid var(--border);}
  .card-foot b{color:var(--text);font-weight:500;}
  details.cut{border-top:1px solid var(--border);}
  details.cut summary{padding:7px 12px;cursor:pointer;font-size:12px;color:var(--warn);}
  details.cut table td{font-size:12px;}
  details.how{margin:-2px 0 10px;font-size:12px;color:var(--muted);}
  details.how summary{cursor:pointer;}
  details.how div{padding:6px 0 0 14px;line-height:1.6;max-width:900px;}
  .stale-note{padding:6px 12px;font-size:12px;color:var(--warn);border-bottom:1px solid var(--border);}
  .tag.auth{background:#4a3b10;color:var(--warn);}
  #jobs tr.stale td{opacity:.55;}
  .est{margin-left:6px;font-size:12px;}
  /* 后台进度 */
  #prog{position:absolute;left:0;right:0;bottom:-1px;height:3px;background:transparent;overflow:hidden;}
  #progBar{height:100%;width:0;background:var(--accent);transition:width .3s;}
  #prog.busy #progBar.indet{width:30%;animation:indet 1.2s linear infinite;}
  @keyframes indet{0%{margin-left:-30%;}100%{margin-left:100%;}}
  #progText{color:#9db8f5;}
  button:disabled{opacity:.6;cursor:default;}
  .card-h .at{margin-left:auto;font-weight:400;}

  /* job 目录信息 */
  #jobs tr.detail td{padding:0 10px 5px;line-height:1.5;background:var(--child);white-space:normal;border-bottom:1px solid var(--border);}
  #jobs tr.child + tr.detail td{border-top:none;}
  .insp{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;font-size:12px;padding-left:18px;}
  .insp .path{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--muted);cursor:copy;word-break:break-all;}
  .insp .path:hover{color:var(--accent);}
  .insp .ff b{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:500;}
  .insp .v{font-variant-numeric:tabular-nums;}
  .insp .last{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--muted);font-size:11px;}
  .insp button{font-size:11px;padding:1px 8px;}
  .ok-tag{display:inline-block;font-size:10px;padding:0 5px;border-radius:3px;background:#173a26;color:var(--ok);}
  .bad-tag{display:inline-block;font-size:10px;padding:0 5px;border-radius:3px;background:#4a1c1c;color:#ff9d9d;max-width:420px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:middle;}
  .insp-full{display:grid;grid-template-columns:minmax(260px,1fr) 2fr;gap:10px;margin:8px 0 2px 18px;}
  .insp-full pre{margin:0;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:8px;font-size:11px;line-height:1.45;max-height:340px;overflow:auto;white-space:pre;}
  .insp-full h4{margin:0 0 4px;font-size:11px;font-weight:500;color:var(--muted);}
  .insp-full .tails{display:flex;flex-direction:column;gap:8px;min-width:0;}
  @media (max-width:900px){ .insp-full{grid-template-columns:1fr;} }
  /* 提醒 */
  #alerts{margin-bottom:12px;}
  .alertbox{background:#2e2610;border:1px solid #5c4a14;border-radius:6px;padding:6px 10px;font-size:12px;}
  .alertbox .ah{color:var(--warn);font-weight:600;margin-right:8px;}
  .alertbox .ah button{font-size:11px;padding:0 7px;margin-left:8px;font-weight:400;}
  .alertbox .ai{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline;padding:2px 0;}
  .alertbox .ai .k{display:inline-block;font-size:10px;padding:0 5px;border-radius:3px;background:#4a3b10;color:var(--warn);}
  .alertbox .ai .k.big{background:#4a1c1c;color:#ff9d9d;}
  .alertbox .ai .p{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--muted);word-break:break-all;cursor:copy;}
  .alertbox .ai .p:hover{color:var(--accent);}
  .alertbox .ai a{color:var(--text);cursor:pointer;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;text-decoration:underline dotted;}
  .alertbox .ai a:hover{color:var(--accent);}
  .insp .size.big{color:#ff9d9d;font-weight:600;}
  #langBtn{font-size:12px;padding:5px 9px;}
  #toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--border);padding:6px 14px;border-radius:6px;opacity:0;transition:opacity .2s;pointer-events:none;}
  #toast.show{opacity:1;}
  @media (max-width:640px){
    header{padding:8px 16px;} main{padding:12px 16px 40px;}
    input[type=text]{width:100%;}
    #qosGrid{grid-template-columns:1fr;}
    .card{overflow-x:auto;}
  }
</style>
</head>
<body>

<header>
  <h1>HPC Job Dashboard</h1>
  <span class="muted" id="updated"></span>
  <select id="clusterFilter"></select>
  <select id="qosFilter"></select>
  <select id="stateFilter">
    <option value="" data-i18n="f_all_states"></option>
    <option value="active" data-i18n="f_active"></option>
    <option value="running" data-i18n="f_running"></option>
    <option value="pending" data-i18n="f_pending"></option>
    <option value="done" data-i18n="f_done"></option>
    <option value="failed" data-i18n="f_failed"></option>
  </select>
  <input type="text" id="searchBox" data-i18n-ph="search_ph">
  <span class="spacer"></span>
  <span class="muted" id="progText"></span>
  <span class="muted" id="summary"></span>
  <button id="refreshBtn" class="primary"></button>
  <button id="langBtn" title="Language / 语言"></button>
  <div id="prog"><div id="progBar"></div></div>
</header>

<main>
  <div id="alerts"></div>
  <div id="errors"></div>

  <h2>QoS <button id="qosToggle"></button>
    <span class="muted" data-i18n="qos_hint"></span></h2>
  <div id="qosGrid"></div>

  <h2><span data-i18n="bl_title"></span> <button id="blToggle"></button>
    <span class="muted" data-i18n="bl_hint"></span></h2>
  <details class="how"><summary data-i18n="bl_how"></summary><div data-i18n-html="bl_how_body"></div></details>
  <div id="blGrid"></div>
  <div id="blNote" class="muted" style="margin:-8px 0 18px"></div>

  <h2>Jobs <button id="expandAll" data-i18n="expand_all"></button><button id="collapseAll" data-i18n="collapse_all"></button>
    <span class="muted" data-i18n="jobs_hint"></span></h2>
  <div class="tablewrap">
    <table id="jobs">
      <thead><tr>
        <th></th><th data-i18n="col_name"></th><th data-i18n="col_cluster"></th><th>Job ID</th><th data-i18n="col_state"></th>
        <th>QoS</th><th data-i18n="col_partition"></th><th data-i18n="col_where"></th><th data-i18n="col_time"></th>
        <th data-i18n="col_when"></th><th data-i18n="col_deps"></th>
      </tr></thead>
      <tbody id="jobsBody"><tr><td colspan="11" class="empty">…</td></tr></tbody>
    </table>
  </div>
</main>
<div id="toast"></div>

<script>
// ---------------- 中英文 ----------------
// 页面上的文字都在这里；后端发来的消息是 {zh, en}，用 tr() 取当前语言
const I18N = {
  zh: {
    never_refreshed: "还没刷新过",
    updated_at: s => "数据更新于 " + s,
    all_clusters: "所有集群", all_qos: "所有 QoS",
    f_all_states: "全部状态", f_active: "活跃（运行+排队）", f_running: "运行中", f_pending: "排队中",
    f_done: "已结束", f_failed: "最近一个失败/取消",
    search_ph: "搜索 job id / 名字 / 节点 / QoS",
    refresh: "立即刷新", refreshing: "刷新中…", queued_btn: "已加入队列",
    collapse: "收起", expand: "展开", expand_all: "全部展开", collapse_all: "全部收起", show_all: "显示全部",
    qos_hint: "点一行按该 QoS 筛选下面的 job · 我的/全集群 = 运行 / 排队",
    bl_title: "排队积压", bl_hint: "每个分区现在的活要多久才能消化完 · 每几分钟更新一次", bl_how: "怎么算的",
    bl_how_body: `把分区里所有 job 的（剩余时长 × 核数）加起来，除以分区总核数，就是"假设完美排满、把现有的活清空要多久"；GPU 同理按卡算。<br>
      范围的前一个数（Local）只算这个分区自己；后一个数（Global）把共享同一批节点的分区都算上（比如 gpu / gpulowpri / gpu-devel 共用一批卡）。真实等待一般落在中间。<br>
      下面 Job 表里你排队的 job 会显示"积压"：取 CPU / GPU 里最慢的那个（瓶颈），多个候选分区取最快的那个。这只是粗略参考：没算优先级、fairshare 和 backfill。<br>
      "插队"= 和你同分区、比你最早排队的 job 晚提交、却已经在跑的别人的 job，通常是靠 backfill（时间短 / 资源少）插进去的。`,
    jobs_hint: "同集群、同名字的 job 收在一行里 · 展开后会读取每个 job 的工作目录 · 点 Job ID / 路径复制",
    col_name: "名字", col_cluster: "集群", col_state: "状态", col_partition: "分区", col_where: "节点 / 原因",
    col_time: "用时 / 限时", col_when: "时间", col_deps: "依赖",
    w_start: "开始", w_est: "预计", w_submit: "提交", w_end: "结束", w_backlog: "积压",
    limit_blocked: "卡在限额",
    limit_tip: r => `卡在限额：${r}\n账户/QoS 的数量或资源上限到顶了，要等你自己（或同组）前面的 job 跑完，积压估计不适用。`,
    est_tip: (p, all, b) => `排队积压估计（分区 ${p}）\n${all}\n瓶颈: ${b}`,
    not_in_history: " (不在历史窗口内)",
    tip_state: "状态", tip_partition: "分区", tip_nodes: "节点", tip_reason: "原因", tip_submit: "提交",
    tip_start: "开始", tip_end: "结束", tip_deps: "依赖", tip_source: "来源",
    click_copy: "点击复制", click_copy_path: "点击复制路径",
    n_running_more: n => `+${n} 个在跑`, n_jobs: n => `${n} 个 job`, current: "↳ 当前",
    no_match: "没有符合条件的 job", summary: (g, n) => `${g} 组 · ${n} 个 job`,
    ionic: "离子步", converged: "已收敛",
    reading: "读取中…", reread: "重新读取", read: "读取", queued_read: "排队读取工作目录…", not_read: "还没读取工作目录",
    du_fail: "du 超时或失败", size_unknown: "大小 ?", same_dir: "同目录：", and_n: n => ` 等 ${n} 个`,
    no_dir: "目录不存在或没权限", no_files: "没有匹配的输出文件", n_files: n => `${n} 个文件`,
    details: "详情", hide_details: "收起详情", read_at: s => `读取于 ${s}`,
    ls_more: (n, k) => `\n…（共 ${n} 个，只显示最新的 ${k} 个）`,
    need_2fa: "需要 2FA", stale_note: s => `下面是 ${s} 的旧数据`, never_fetched: `还没拉取过，点"立即刷新"`,
    load_private_tip: "这个集群的 squeue 只能看到你自己的 job（PrivateData），没法统计全集群",
    load_tip: "所有用户在这个 QoS 上 运行 / 排队 的 job 数",
    sub_full: "提交已满", run_full: "运行已满", hidden: "隐藏",
    mine_summary: (r, p) => `我的：<span class="n-r">${r}</span> 运行 · <span class="n-pd">${p}</span> 排队`,
    data_at: s => `${s} 的数据`,
    th_mine: "我的", th_all: "全集群",
    th_maxjobs_tip: "每人最多同时运行的 job 数 (MaxJobsPU)", th_maxsubmit_tip: "每人最多提交的 job 数 (MaxSubmitPU)",
    th_maxwall_tip: "单个 job 最长时间 (MaxWall)", th_maxtres_tip: "每人资源上限 (MaxTRESPU)", th_maxtres: "MaxTRES/人",
    no_qos: "没查到 QoS（可以在 config.yaml 里手动写）",
    cant_estimate: "没法估计", cluster_down: "（集群现在连不上）",
    gpu_pool: "GPU 池：", pool_item: (t, n, ps) => `<b>${t}</b> ${n} 卡（${ps} 共用）`,
    cutters: (n, k) => `插队：${n} 个比你晚提交的 job 已经在跑${k ? `（显示最新 ${k} 个）` : ""}`,
    th_account: "账户", th_res: "资源", th_limit: "申请时长", th_reason: "推测原因",
    th_cpus: "总核数", th_gpus: "总卡数", th_cpu_bl: "CPU 积压", th_gpu_bl: "GPU 积压",
    bl_range_tip: "Local（只算本分区） – Global（算上共享节点的分区）",
    alerts: n => `提醒 ${n}`, al_same_dir: "同目录同时运行",
    al_same_dir_msg: n => `${n} 个 job 在同一个目录里跑（dependency 可能没设对）：`, al_stale: "（旧数据）",
    al_big_dir: "目录过大",
    copied: s => "已复制 " + s, copied_path: "已复制路径",
    not_in_list: "这个 job 不在当前列表里（可能被筛选掉或超出历史窗口）",
    bg: "后台：", bg_working: "处理中", bg_steps: (d, n) => `（${d}/${n} 步）`, bg_more: n => ` · 还有 ${n} 个任务`,
    server_down: "连不上本机的 dashboard 服务",
  },
  en: {
    never_refreshed: "Not refreshed yet",
    updated_at: s => "Updated " + s,
    all_clusters: "All clusters", all_qos: "All QoS",
    f_all_states: "All states", f_active: "Active (running + pending)", f_running: "Running", f_pending: "Pending",
    f_done: "Finished", f_failed: "Last one failed/cancelled",
    search_ph: "Search job id / name / node / QoS",
    refresh: "Refresh", refreshing: "Refreshing…", queued_btn: "Queued",
    collapse: "Hide", expand: "Show", expand_all: "Expand all", collapse_all: "Collapse all", show_all: "Show all",
    qos_hint: "Click a row to filter jobs by that QoS · Mine / Cluster = running / pending",
    bl_title: "Queue backlog", bl_hint: "How long each partition needs to drain its current work · updated every few minutes",
    bl_how: "How is this computed?",
    bl_how_body: `Sum (remaining time × cores) over all jobs in a partition and divide by the partition's total cores: "how long to clear the current work if it packed perfectly". GPUs are the same, counted in cards.<br>

const tr = m => m === null || m === undefined ? "" : typeof m === "object" ? (m[lang] ?? m.zh ?? "") : String(m);

function applyStatic(){

const STATE_COLOR = {
  RUNNING:"#2ecc71", COMPLETING:"#27ae60", CONFIGURING:"#27ae60",
  PENDING:"#f1c40f", SUSPENDED:"#9b59b6", REQUEUED:"#f39c12", REQUEUE_HOLD:"#f39c12",
  COMPLETED:"#6b7385", CANCELLED:"#e67e22", FAILED:"#e74c3c", TIMEOUT:"#c0392b",
  NODE_FAIL:"#c0392b", OUT_OF_MEMORY:"#c0392b", PREEMPTED:"#c0392b", BOOT_FAIL:"#c0392b", DEADLINE:"#c0392b",
};
const SHORT = {RUNNING:"R",COMPLETING:"CG",CONFIGURING:"CF",PENDING:"PD",SUSPENDED:"S",REQUEUED:"RQ",
  COMPLETED:"CD",CANCELLED:"CA",FAILED:"F",TIMEOUT:"TO",NODE_FAIL:"NF",OUT_OF_MEMORY:"OOM",PREEMPTED:"PR"};
const ORDER = ["RUNNING","COMPLETING","CONFIGURING","PENDING","SUSPENDED","REQUEUED","COMPLETED",
  "FAILED","TIMEOUT","OUT_OF_MEMORY","NODE_FAIL","PREEMPTED","CANCELLED"];
const ACTIVE = new Set(["RUNNING","COMPLETING","CONFIGURING"]);
const PEND = new Set(["PENDING","SUSPENDED","REQUEUED","REQUEUE_HOLD","RESV_DEL_HOLD"]);
const BAD = new Set(["FAILED","CANCELLED","TIMEOUT","NODE_FAIL","OUT_OF_MEMORY","PREEMPTED","BOOT_FAIL","DEADLINE"]);
const LIGHT_TEXT = new Set(["COMPLETED","FAILED","TIMEOUT","NODE_FAIL","OUT_OF_MEMORY","PREEMPTED","BOOT_FAIL","DEADLINE","SUSPENDED"]);

const colorFor = s => STATE_COLOR[s] || "#3498db";
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const jobKey = j => j.cluster + ":" + j.id;
const idNum = j => parseInt(j.id, 10) || 0;
const fmtTime = s => s ? s.slice(5, 16).replace("T", " ") : "-";
const fmtH = h => h < 0.1 ? "0h" : h > 48 ? (h / 24).toFixed(1) + "d" : h.toFixed(1) + "h";
const hCls = h => h < 6 ? "h-ok" : h < 24 ? "h-mid" : "h-bad";
const fmtRange = (a, b) => `<span class="${hCls(b)}">${Math.abs(b - a) < 0.05 ? fmtH(b) : fmtH(a) + " – " + fmtH(b)}</span>`;
const localTime = iso => iso ? new Date(iso).toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"}) : "";

let expanded = new Set(loadPref("expanded", []));
let filters = Object.assign({cluster:"", qos:"", state:"", search:""}, loadPref("filters", {}));
filters.search = "";
let qosCollapsed = loadPref("qosCollapsed", false);
let blCollapsed = loadPref("blCollapsed", false);
let detailOpen = new Set();      // 展开了"详情"（ls + tail 全文）的 job
let requested = new Set();       // 这次打开页面已经请求过读取目录的 job
let pendingInspect = new Set();
let lastData = null;
let jobsByKey = {};
let groupOfJob = {};

function stBadge(s){
  return `<span class="st ${LIGHT_TEXT.has(s) ? "light" : ""}" style="--c:${colorFor(s)}">${esc(s)}</span>`;
}

// ---------------- 分组 ----------------
function buildGroups(jobs){
  const map = new Map();
  for (const j of jobs){
    const k = j.cluster + "\u0000" + j.name;
    if (!map.has(k)) map.set(k, {key:k, cluster:j.cluster, name:j.name, jobs:[]});
    map.get(k).jobs.push(j);
  }
  const groups = [...map.values()];
  for (const g of groups){
    g.jobs.sort((a, b) => idNum(a) - idNum(b) || a.id.localeCompare(b.id));
    // 代表这一组的 job：正在跑的 > 下一个排队的 > 最后一个
    g.rep = g.jobs.find(j => ACTIVE.has(j.state)) || g.jobs.find(j => PEND.has(j.state)) || g.jobs[g.jobs.length - 1];
    g.rank = ACTIVE.has(g.rep.state) ? 0 : PEND.has(g.rep.state) ? 1 : 2;
    g.maxId = Math.max(...g.jobs.map(idNum));
    g.counts = {};
    for (const j of g.jobs) g.counts[j.state] = (g.counts[j.state] || 0) + 1;
    g.qosList = [...new Set(g.jobs.map(j => j.qos).filter(Boolean))];
    g.nRunning = g.jobs.filter(j => ACTIVE.has(j.state)).length;
  }
  groups.sort((a, b) => a.rank - b.rank || a.cluster.localeCompare(b.cluster) || b.maxId - a.maxId);
  return groups;
}

function groupVisible(g){
  if (filters.cluster && g.cluster !== filters.cluster) return false;
  if (filters.qos){
    const [c, q] = filters.qos.split("|");
    if (g.cluster !== c || !g.jobs.some(j => j.qos === q)) return false;
  }
  const s = g.rep.state;
  switch (filters.state){
    case "active":  if (g.rank > 1) return false; break;
    case "running": if (g.rank !== 0) return false; break;
    case "pending": if (!g.jobs.some(j => PEND.has(j.state))) return false; break;
    case "done":    if (g.rank !== 2) return false; break;
    case "failed":  if (g.rank !== 2 || !BAD.has(s)) return false; break;
  }
  if (filters.search){
    const q = filters.search.toLowerCase();
    const hit = g.jobs.some(j => [j.id, j.name, j.nodelist, j.qos, j.partition, j.cluster].join(" ").toLowerCase().includes(q));
    if (!hit) return false;
  }
  return true;
}

// ---------------- 单元格 ----------------
function whereCell(j){
  if (ACTIVE.has(j.state)) return esc(j.nodelist || "-");
  if (PEND.has(j.state)) return `<span class="muted">${esc(j.reason || "-")}</span>`;
  return `<span class="muted">${esc(j.nodelist || "")}</span>`;
}
function timeUsedCell(j){
  if (ACTIVE.has(j.state)) return `${esc(j.time_used)} <span class="muted">/ ${esc(j.time_limit || "-")}</span>`;
  if (PEND.has(j.state)) return `<span class="muted">— / ${esc(j.time_limit || "-")}</span>`;
  return esc(j.time_used || "-");
}
function whenCell(j){
  if (ACTIVE.has(j.state)) return `<span class="muted">${t("w_start")}</span> ${fmtTime(j.start)}`;
  if (PEND.has(j.state)){
    const base = j.start ? `<span class="muted">${t("w_est")}</span> ${fmtTime(j.start)}` : `<span class="muted">${t("w_submit")}</span> ${fmtTime(j.submit)}`;
    // AssocGrpJobsLimit / QOSMaxGRESPerUser 这类：是你自己（或组）的额度满了，不是在等空位
    if (/^(Assoc|QOS)(Grp|Max)/.test(j.reason || "")){
      return `${base}<span class="est h-mid" title="${esc(t("limit_tip", j.reason))}">${t("limit_blocked")}</span>`;
    }
    const w = j.wait_est;
    if (!w) return base;
    const tip = t("est_tip", w.partition, w.all.map(e => `${e.label}: ${fmtH(e.min)} – ${fmtH(e.max)}`).join("  <  "), w.bottleneck.label);
    return `${base}<span class="est" title="${esc(tip)}"><span class="muted">${t("w_backlog")}</span> ${fmtRange(w.bottleneck.min, w.bottleneck.max)}</span>`;
  }
  return `<span class="muted">${t("w_end")}</span> ${fmtTime(j.end)}`;
}
function depsCell(j){
  if (!j.deps || !j.deps.length) return "";
  return j.deps.map(d => {
    if (!d.id) return `<span class="dep">${esc(d.type)}</span>`;
    const target = jobsByKey[j.cluster + ":" + d.id];
    const st = target ? target.state : "UNKNOWN";
    const sameName = target && target.name === j.name;
    const label = target ? (sameName ? "" : " " + target.name) : t("not_in_history");
    const tip = `${d.type}:${d.id}${d.status ? " (" + d.status + ")" : ""} → ${st}${target ? " " + target.name : ""}`;
    return `<span class="dep" data-jump="${esc(j.cluster + ":" + d.id)}" title="${esc(tip)}">`
      + `<span class="dot" style="--c:${colorFor(st)}"></span>${esc(d.type)} <b>#${esc(d.id)}</b>${esc(label)}</span>`;
  }).join("");
}
function jobTip(j){
  return [
    `#${j.id}  ${j.name}`, `${t("tip_state")}: ${j.state}`, `QoS: ${j.qos || "-"}  ${t("tip_partition")}: ${j.partition || "-"}`,
    `${t("tip_nodes")}: ${j.nodelist || "-"}`, j.reason ? `${t("tip_reason")}: ${j.reason}` : "",
    `${t("tip_submit")}: ${j.submit || "-"}`, `${t("tip_start")}: ${j.start || "-"}`, `${t("tip_end")}: ${j.end || "-"}`,
    j.dependency_raw ? `${t("tip_deps")}: ${j.dependency_raw}` : "", `${t("tip_source")}: ${j.source}`,
  ].filter(Boolean).join("\n");
}

function jobCells(j, nameHtml){
  return `<td class="name" title="${esc(jobTip(j))}">${nameHtml}</td>
    <td>${esc(j.cluster)}</td>
    <td class="jid" data-copy="${esc(j.id)}" title="${t("click_copy")}">${esc(j.id)}</td>
    <td>${stBadge(j.state)}</td>
    <td>${esc(j.qos || "-")}</td>
    <td class="part" title="${esc(j.partition)}">${esc(j.partition || "-")}</td>
    <td class="where" title="${esc(j.nodelist || j.reason)}">${whereCell(j)}</td>
    <td class="num">${timeUsedCell(j)}</td>
    <td class="num">${whenCell(j)}</td>
    <td>${depsCell(j)}</td>`;
}

function countPills(g){
  const states = Object.keys(g.counts).sort((a, b) => (ORDER.indexOf(a) + 99) % 99 - (ORDER.indexOf(b) + 99) % 99);
  return states.map(s => `<span class="cnt" style="--c:${colorFor(s)}" title="${esc(s)}">${esc(SHORT[s] || s)} ${g.counts[s]}</span>`).join("");
}

function groupRow(g){
  const j = g.rep;
  const open = expanded.has(g.key);
  const where = g.nRunning > 1 ? `${whereCell(j)} <span class="muted">${t("n_running_more", g.nRunning - 1)}</span>` : whereCell(j);
  return `<tr class="grp ${open ? "open" : ""}${j.stale ? " stale" : ""}" data-group="${esc(g.key)}" id="row-${esc(jobKey(j))}">
    <td class="tog"><span class="tri">▶</span></td>
    <td class="name" title="${esc(g.name)}  (${t("n_jobs", g.jobs.length)})">${esc(g.name)}<span class="count">×${g.jobs.length}</span></td>
    <td>${esc(g.cluster)}</td>
    <td class="jid" data-copy="${esc(j.id)}" title="${t("click_copy")}">${esc(j.id)}</td>
    <td>${stBadge(j.state)}<span class="cnts">${countPills(g)}</span></td>
    <td>${esc(g.qosList.join(", ") || "-")}</td>
    <td class="part" title="${esc(j.partition)}">${esc(j.partition || "-")}</td>
    <td class="where" title="${esc(j.nodelist || j.reason)}">${where}</td>
    <td class="num">${timeUsedCell(j)}</td>
    <td class="num">${whenCell(j)}</td>
    <td>${depsCell(j)}</td>
  </tr>`;
}

// ---------------- job 目录信息 ----------------
const fmtSize = n => n < 1024 ? n + "B" : n < 1048576 ? (n / 1024).toFixed(0) + "K" : n < 1073741824 ? (n / 1048576).toFixed(1) + "M" : (n / 1073741824).toFixed(1) + "G";
const fnum = (v, d) => v === null || v === undefined ? "?" : v.toFixed(d);
const fexp = v => v === null || v === undefined ? "?" : v.toExponential(1);

function fileSummary(f){
  const p = f.parsed || {};
  const bits = [];
  if (p.ionic_step !== undefined) bits.push(`${t("ionic")} <span class="v">${p.ionic_step}</span>`, `F <span class="v">${fnum(p.F, 4)}</span>`, `dE <span class="v">${fexp(p.dE)}</span>`);
  if (p.elec_step !== undefined) bits.push(`${esc(p.elec_algo)} <span class="v">${p.elec_step}</span>`);
  if (p.mag !== undefined) bits.push(`mag <span class="v">${fnum(p.mag, 2)}</span>`);
  if (p.converged) bits.push(`<span class="ok-tag">${t("converged")}</span>`);
  if (p.error) bits.push(`<span class="bad-tag" title="${esc(p.error)}">${esc(p.error)}</span>`);
  if (!bits.length && p.last_line) bits.push(`<span class="last" title="${esc(p.last_line)}">${esc(p.last_line.slice(0, 90))}</span>`);
  return `<span class="ff"><b>${esc(f.name)}</b> <span class="muted">${esc(f.mtime || "")}</span> ${bits.join(" · ")}</span>`;
}

function detailRow(j){
  const k = jobKey(j), ins = (lastData.inspect || {})[k], pending = pendingInspect.has(k);
  const reload = `<button data-insp-reload="${esc(k)}"${pending ? " disabled" : ""}>${pending ? t("reading") : ins ? t("reread") : t("read")}</button>`;
  let body;
  if (!ins){
    body = pending ? `<span class="muted">${t("queued_read")}</span>` : `<span class="muted">${t("not_read")}</span> ${reload}`;
  } else if (ins.error){
    body = `<span class="bad-tag" title="${esc(tr(ins.error))}">${esc(tr(ins.error))}</span> ${reload}`;
  } else {
    const path = `<span class="path" data-copy="${esc(ins.dir)}" title="${t("click_copy_path")}">${esc(ins.dir)}</span>`;
    const limitGb = (lastData.settings || {}).dir_size_warn_gb || 30;
    const sizeHtml = ins.size_kb === null || ins.size_kb === undefined
      ? (ins.exists ? `<span class="muted" title="${t("du_fail")}">${t("size_unknown")}</span>` : "")
      : `<span class="size${ins.size_kb > limitGb * 1048576 ? " big" : ""}" title="du -sk">${fmtSize(ins.size_kb * 1024)}</span>`;
    const shared = ins.shared && ins.shared.length
      ? `<span class="muted">${t("same_dir")}${ins.shared.slice(0, 6).map(x => `<a class="dep" data-jump="${esc(j.cluster + ":" + x)}"><b>#${esc(x)}</b></a>`).join("")}${ins.shared.length > 6 ? t("and_n", ins.shared.length) : ""}</span>` : "";
    if (!ins.exists){
      body = `${path} <span class="bad-tag">${t("no_dir")}</span> ${reload}`;
    } else {
      const files = ins.files.length ? ins.files.map(fileSummary).join("") : `<span class="muted">${t("no_files")}</span>`;
      const open = detailOpen.has(k);
      body = `${path}${sizeHtml}<span class="muted">${t("n_files", ins.count ?? "?")}</span>${shared}${files}
        <button data-insp-toggle="${esc(k)}">${open ? t("hide_details") : t("details")}</button>${reload}
        <span class="muted">${t("read_at", localTime(ins.at))}</span>`;
      if (open){
        const ls = ins.ls.map(e => `${e.mtime}  ${fmtSize(e.size).padStart(6)}  ${e.name}${e.is_dir ? "/" : ""}`).join("\n");
        const more = ins.count > ins.ls.length ? t("ls_more", ins.count, ins.ls.length) : "";
        const tails = ins.files.map(f => `<div><h4>tail ${esc(f.name)}</h4><pre>${esc(f.tail.join("\n"))}</pre></div>`).join("");
        body += `</div><div class="insp-full"><div><h4>ls -lt</h4><pre>${esc(ls + more)}</pre></div><div class="tails">${tails || `<span class="muted">${t("no_files")}</span>`}</div>`;
      }
    }
  }
  return `<tr class="detail${j.stale ? " stale" : ""}"><td></td><td colspan="10"><div class="insp">${body}</div></td></tr>`;
}

async function requestInspect(keys, force){
  keys = keys.filter(k => force || !requested.has(k));
  if (!keys.length) return;
  keys.forEach(k => requested.add(k));
  try{
    await fetch("api/inspect", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({keys, force: !!force})});
  }catch(e){}
  kick();
}

// ---------------- 渲染 ----------------
function renderJobs(){
  const groups = buildGroups(lastData.jobs).filter(groupVisible);
  groupOfJob = {};
  const rows = [], wantInspect = [];
  let nJobs = 0;
  for (const g of groups){
    nJobs += g.jobs.length;
    g.jobs.forEach(j => groupOfJob[jobKey(j)] = g.key);
    if (g.jobs.length === 1){
      // 单个 job 也能展开，看它的工作目录
      const j = g.jobs[0], open = expanded.has(g.key);
      rows.push(`<tr class="grp one${open ? " open" : ""}${j.stale ? " stale" : ""}" data-group="${esc(g.key)}" id="row-${esc(jobKey(j))}"><td class="tog"><span class="tri">▶</span></td>${jobCells(j, esc(j.name))}</tr>`);
      if (open){ rows.push(detailRow(j)); wantInspect.push(jobKey(j)); }
      continue;
    }
    rows.push(groupRow(g));
    if (expanded.has(g.key)){
      for (const j of g.jobs){
        const isRep = j === g.rep;
        rows.push(`<tr class="child${j.stale ? " stale" : ""}"${isRep ? "" : ` id="row-${esc(jobKey(j))}"`}><td class="tog"></td>${jobCells(j, isRep ? t("current") : "↳")}</tr>`);
        rows.push(detailRow(j));
        wantInspect.push(jobKey(j));
      }
    }
  }
  document.getElementById("jobsBody").innerHTML = rows.join("")
    || `<tr><td colspan="11" class="empty">${t("no_match")}</td></tr>`;
  document.getElementById("summary").textContent = t("summary", groups.length, nJobs);
  // 展开着的 job 如果还没读过目录，就请求后台去读（后台会跳过已经读过的）
  const ins = lastData.inspect || {};
  const need = wantInspect.filter(k => !ins[k] && !pendingInspect.has(k));
  if (need.length) requestInspect(need, false);
}

function renderQos(){
  const grid = document.getElementById("qosGrid");
  grid.style.display = qosCollapsed ? "none" : "";
  document.getElementById("qosToggle").textContent = qosCollapsed ? t("expand") : t("collapse");
  grid.innerHTML = (lastData.clusters || []).map(c => {
    const dot = `<span class="dot" style="--c:${c.ok ? "var(--ok)" : c.need_input ? "var(--warn)" : "var(--bad)"}"></span>`;
    const authTag = c.need_input ? `<span class="tag auth">${t("need_2fa")}</span>` : "";
    const errHtml = c.ok ? "" : `<div class="card-err">${esc(tr(c.error) || "error")}</div>`
      + (c.stale_since ? `<div class="stale-note">${t("stale_note", localTime(c.stale_since))}</div>` : "");
    if (c.never) return `<div class="card"><div class="card-h"><span class="dot" style="--c:#4a5063"></span>${esc(c.name)}</div><div class="card-err" style="color:var(--muted)">${t("never_fetched")}</div></div>`;
    if (!c.ok && !c.stale_since) return `<div class="card"><div class="card-h">${dot}${esc(c.name)}${authTag}</div>${errHtml}</div>`;
    const mr = c.qos.reduce((a, q) => a + q.mine_running, 0), mp = c.qos.reduce((a, q) => a + q.mine_pending, 0);
    const loadTip = c.load_private ? t("load_private_tip") : t("load_tip");
    const rows = c.qos.map(q => {
      const sel = filters.qos === c.name + "|" + q.name;
      const maxJ = parseInt(q.max_jobs_pu, 10), maxS = parseInt(q.max_submit_pu, 10);
      const full = maxJ && q.mine_running >= maxJ;
      const subfull = maxS && q.mine_running + q.mine_pending >= maxS;
      const idle = !q.mine_running && !q.mine_pending;
      const n = (v, cls) => v === null || v === undefined ? `<span class="n-0">—</span>` : `<span class="${v ? cls : "n-0"}">${v}</span>`;
      const tags = (q.configured ? `<span class="tag cfg">config</span>` : "")
        + (subfull ? `<span class="tag subfull">${t("sub_full")}</span>` : full ? `<span class="tag full">${t("run_full")}</span>` : "");
      return `<tr class="${sel ? "sel" : ""} ${subfull ? "subfull" : full ? "full" : ""} ${idle ? "idle" : ""}" data-qos="${esc(c.name + "|" + q.name)}">
        <td class="qname">${esc(q.name)}${tags}${q.note ? `<span class="note">${esc(q.note)}</span>` : ""}</td>
        <td class="mine">${n(q.mine_running, "n-r")} / ${n(q.mine_pending, "n-pd")}</td>
        <td title="${esc(loadTip)}">${c.load_private ? `<span class="n-0">${t("hidden")}</span>` : `${n(q.all_running, "n-r")} / ${n(q.all_pending, "n-pd")}`}</td>
        <td class="lim">${esc(q.max_jobs_pu || "-")}</td>
        <td class="lim">${esc(q.max_submit_pu || "-")}</td>
        <td class="lim">${esc(q.max_wall || "-")}</td>
        <td class="lim tres">${esc((q.max_tres_pu || "-").replace(/,/g, ", "))}</td>
      </tr>`;
    }).join("");
    return `<div class="card">
      <div class="card-h">${dot}${esc(c.name)}${authTag}<span class="muted">${t("mine_summary", mr, mp)}</span><span class="muted at">${c.ok ? t("data_at", localTime(c.at)) : ""}</span></div>
      ${errHtml}
      <table class="qos">
        <thead><tr><th>QoS</th><th>${t("th_mine")}</th><th title="${esc(loadTip)}">${t("th_all")}</th>
          <th title="${t("th_maxjobs_tip")}">MaxJobs</th>
          <th title="${t("th_maxsubmit_tip")}">MaxSubmit</th>
          <th title="${t("th_maxwall_tip")}">MaxWall</th>
          <th title="${t("th_maxtres_tip")}">${t("th_maxtres")}</th></tr></thead>
        <tbody>${rows || `<tr><td colspan="7" class="empty">${t("no_qos")}</td></tr>`}</tbody>
      </table></div>`;
  }).join("");
}

function renderBacklog(){
  const grid = document.getElementById("blGrid");
  grid.style.display = blCollapsed ? "none" : "";
  document.getElementById("blToggle").textContent = blCollapsed ? t("expand") : t("collapse");
  const all = (lastData.clusters || []).filter(c => c.backlog);
  // 估计不了的集群（比如看不到别人的 job）只写一行说明，不占一整张卡片
  document.getElementById("blNote").innerHTML = all.filter(c => !c.backlog.ok)
    .map(c => `<div>${esc(c.name)}: ${esc(tr(c.backlog.error) || t("cant_estimate"))}</div>`).join("");
  document.getElementById("blNote").style.display = blCollapsed ? "none" : "";
  grid.innerHTML = all.filter(c => c.backlog.ok).map(c => {
    const b = c.backlog;
    const head = `<div class="card-h"><span class="dot" style="--c:${b.ok ? "var(--ok)" : "#4a5063"}"></span>${esc(c.name)}`
      + `<span class="muted">${b.fetched_at ? t("data_at", localTime(b.fetched_at)) : ""}${c.stale_since ? t("cluster_down") : ""}</span></div>`;
    const rows = b.partitions.map(p => {
      const gpu = p.gpu.length ? p.gpu.map(g => `<span class="gpuv"><span class="t">${esc(g.type)}</span> ${fmtRange(g.min, g.max)}</span>`).join("") : `<span class="n-0">—</span>`;
      const mine = p.mine_running || p.mine_pending;
      return `<tr class="${mine ? "mine" : ""}">
        <td>${esc(p.name)}</td>
        <td class="lim">${p.cpus}</td>
        <td class="lim">${p.gpus || "-"}</td>
        <td>${fmtRange(p.cpu_min, p.cpu_max)}</td>
        <td>${gpu}</td>
        <td>${mine ? `<span class="${p.mine_running ? "n-r" : "n-0"}">${p.mine_running}</span> / <span class="${p.mine_pending ? "n-pd" : "n-0"}">${p.mine_pending}</span>` : `<span class="n-0">—</span>`}</td>
      </tr>`;
    }).join("");
    const pools = b.pools.length ? `<div class="card-foot">${t("gpu_pool")}` + b.pools.map(pl =>
      t("pool_item", esc(pl.type), pl.cards, esc(pl.partitions.join(", ")))).join(" · ") + `</div>` : "";
    const cut = b.cutters_total ? `<details class="cut"><summary>${t("cutters", b.cutters_total, b.cutters_total > b.cutters.length ? b.cutters.length : 0)}</summary>
      <table><thead><tr><th>Job ID</th><th>${t("col_partition")}</th><th>${t("th_account")}</th><th>${t("th_res")}</th><th>${t("th_limit")}</th><th>${t("th_reason")}</th></tr></thead><tbody>`
      + b.cutters.map(x => `<tr><td>${esc(x.id)}</td><td>${esc(x.partition)}</td><td>${esc(x.account)}</td><td>${x.cpus}C/${x.gpus}G</td><td>${esc(x.limit)}</td><td>${esc(tr(x.reason))}</td></tr>`).join("")
      + `</tbody></table></details>` : "";
    return `<div class="card">${head}
      <table class="bl"><thead><tr><th>${t("col_partition")}</th><th>${t("th_cpus")}</th><th>${t("th_gpus")}</th>
        <th title="${t("bl_range_tip")}">${t("th_cpu_bl")}</th><th>${t("th_gpu_bl")}</th><th>${t("th_mine")}</th></tr></thead>
      <tbody>${rows}</tbody></table>${pools}${cut}</div>`;
  }).join("");
}

function renderFilters(){
  const csel = document.getElementById("clusterFilter");
  const qsel = document.getElementById("qosFilter");
  const clusters = ((lastData && lastData.clusters) || []).map(c => c.name);
  csel.innerHTML = `<option value="">${t("all_clusters")}</option>` + clusters.map(n => `<option value="${esc(n)}">${esc(n)}</option>`).join("");
  const qopts = [];
  for (const c of (lastData && lastData.clusters) || []) for (const q of c.qos || []) qopts.push(c.name + "|" + q.name);
  if (filters.qos && !qopts.includes(filters.qos)) qopts.push(filters.qos);
  qsel.innerHTML = `<option value="">${t("all_qos")}</option>` + qopts.map(v => `<option value="${esc(v)}">${esc(v.replace("|", " / "))}</option>`).join("");
  csel.value = filters.cluster; qsel.value = filters.qos;
  document.getElementById("stateFilter").value = filters.state;
}

let alertsAll = false;
function renderAlerts(){
  const al = lastData.alerts || [];
  const el = document.getElementById("alerts");
  if (!al.length){ el.innerHTML = ""; return; }
  const limitGb = (lastData.settings || {}).dir_size_warn_gb || 30;
  const jobLinks = a => a.jobs.slice(0, 8).map(id => `<a data-jump="${esc(a.cluster + ":" + id)}">#${esc(id)}</a>`).join(" ") + (a.jobs.length > 8 ? t("and_n", a.jobs.length) : "");
  const path = a => `<span class="p" data-copy="${esc(a.dir)}" title="${t("click_copy_path")}">${esc(a.dir)}</span>`;
  const item = a => a.type === "same_dir"
    ? `<div class="ai"><span class="k">${t("al_same_dir")}</span><b>${esc(a.cluster)}</b> ${t("al_same_dir_msg", a.jobs.length)}${jobLinks(a)}${a.stale ? ` <span class="muted">${t("al_stale")}</span>` : ""} ${path(a)}</div>`
    : `<div class="ai"><span class="k big">${t("al_big_dir")}</span><b>${esc(a.cluster)}</b> ${fmtSize(a.size_kb * 1024)} &gt; ${limitGb}G: ${jobLinks(a)} ${path(a)}</div>`;
  const shown = alertsAll ? al : al.slice(0, 4);
  el.innerHTML = `<div class="alertbox"><span class="ah">${t("alerts", al.length)}${al.length > 4 ? `<button id="alertsMore">${alertsAll ? t("collapse") : t("show_all")}</button>` : ""}</span>${shown.map(item).join("")}</div>`;
}
document.getElementById("alerts").addEventListener("click", e => {
  if (e.target.id === "alertsMore"){ alertsAll = !alertsAll; renderAlerts(); return; }
  const copy = e.target.closest("[data-copy]");
  if (copy){ copyText(copy.dataset.copy).then(() => toast(t("copied_path"))); return; }
  const jump = e.target.closest("[data-jump]");
  if (jump) jumpTo(jump.dataset.jump);
});

function renderErrors(){
  // 连不上的集群在 QoS 卡片里已经显示了错误，这里不重复
  const shown = new Set((lastData.clusters || []).filter(c => !c.ok).map(c => `${c.name}: ${tr(c.error)}`));
  const errs = (lastData.errors || []).map(tr).filter(e => !shown.has(e));
  document.getElementById("errors").innerHTML = errs.length
    ? `<div class="errbox">${errs.map(e => `<div>${esc(e)}</div>`).join("")}</div>` : "";
}

function renderUpdated(){
  document.getElementById("updated").textContent = lastData && lastData.updated_at
    ? t("updated_at", new Date(lastData.updated_at).toLocaleString([], {month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", second: "2-digit"}))
    : t("never_refreshed");
}

function render(){
  if (!lastData) return;
  jobsByKey = {};
  lastData.jobs.forEach(j => jobsByKey[jobKey(j)] = j);
  pendingInspect = new Set(lastData.inspect_pending || []);
  renderFilters(); renderAlerts(); renderErrors(); renderQos(); renderBacklog(); renderJobs(); renderUpdated();
}

function setFilter(k, v){ filters[k] = v; savePref("filters", {...filters, search: ""}); render(); }

// ---------------- 交互 ----------------
function toast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg; el.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove("show"), 1200);
}
function copyText(s){
  if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(s);
  const ta = document.createElement("textarea"); ta.value = s; document.body.appendChild(ta);
  ta.select(); try{ document.execCommand("copy"); } finally { ta.remove(); }
  return Promise.resolve();
}
function jumpTo(key){
  const gk = groupOfJob[key];
  if (!gk && !document.getElementById("row-" + key)){ toast(t("not_in_list")); return; }
  if (gk && !expanded.has(gk)){ expanded.add(gk); savePref("expanded", [...expanded]); renderJobs(); }
  const row = document.getElementById("row-" + key) || document.querySelector(`tr[data-group="${CSS.escape(gk)}"]`);
  if (!row) return;
  row.scrollIntoView({block:"center", behavior:"smooth"});
  row.classList.remove("flash"); void row.offsetWidth; row.classList.add("flash");
}

document.getElementById("jobsBody").addEventListener("click", e => {
  const copy = e.target.closest("[data-copy]");
  if (copy){ copyText(copy.dataset.copy).then(() => toast(t("copied", copy.dataset.copy))); return; }
  const dep = e.target.closest("[data-jump]");
  if (dep){ jumpTo(dep.dataset.jump); return; }
  const tg = e.target.closest("[data-insp-toggle]");
  if (tg){ const k = tg.dataset.inspToggle; detailOpen.has(k) ? detailOpen.delete(k) : detailOpen.add(k); renderJobs(); return; }
  const rl = e.target.closest("[data-insp-reload]");
  if (rl){ rl.disabled = true; rl.textContent = t("reading"); requestInspect([rl.dataset.inspReload], true); return; }
  if (e.target.closest("tr.detail")) return;
  const grp = e.target.closest("tr.grp");
  if (grp){
    const k = grp.dataset.group;
    expanded.has(k) ? expanded.delete(k) : expanded.add(k);
    savePref("expanded", [...expanded]); renderJobs();
  }
});
document.getElementById("qosGrid").addEventListener("click", e => {
  const tr_ = e.target.closest("tr[data-qos]");
  if (!tr_) return;
  setFilter("qos", filters.qos === tr_.dataset.qos ? "" : tr_.dataset.qos);
});
document.getElementById("clusterFilter").addEventListener("change", e => setFilter("cluster", e.target.value));
document.getElementById("qosFilter").addEventListener("change", e => setFilter("qos", e.target.value));
document.getElementById("stateFilter").addEventListener("change", e => setFilter("state", e.target.value));
document.getElementById("searchBox").addEventListener("input", e => { filters.search = e.target.value.trim(); renderJobs(); });
document.getElementById("qosToggle").addEventListener("click", () => { qosCollapsed = !qosCollapsed; savePref("qosCollapsed", qosCollapsed); renderQos(); });
document.getElementById("blToggle").addEventListener("click", () => { blCollapsed = !blCollapsed; savePref("blCollapsed", blCollapsed); renderBacklog(); });
document.getElementById("expandAll").addEventListener("click", () => {
  buildGroups(lastData.jobs).filter(groupVisible).forEach(g => { if (g.jobs.length > 1) expanded.add(g.key); });
  savePref("expanded", [...expanded]); renderJobs();
});
document.getElementById("collapseAll").addEventListener("click", () => { expanded.clear(); savePref("expanded", []); renderJobs(); });
document.getElementById("refreshBtn").addEventListener("click", async () => {
  const btn = document.getElementById("refreshBtn");
  btn.disabled = true; btn.textContent = t("queued_btn");
  try{ await fetch("api/refresh", {method: "POST"}); }catch(e){}
  kick();
});
document.getElementById("langBtn").addEventListener("click", () => {
  lang = lang === "zh" ? "en" : "zh";
  savePref("lang", lang);
  applyStatic();
  render();
  if (lastProgress) renderProgress(lastProgress);
});

// ---------------- 和后台同步 ----------------
// 页面只读本机 Flask 里的结果，不等 SSH：每隔一会儿问一下 /api/status（很轻），
// 版本号变了才重新拉 /api/jobs。后台忙的时候问得勤一点，好让进度条动起来。
let version = -1, tickTimer = null, busy = false, lastProgress = null;

function renderProgress(pr){
  lastProgress = pr;
  busy = pr.busy;
  const bar = document.getElementById("progBar"), wrap = document.getElementById("prog");
  wrap.classList.toggle("busy", pr.busy);
  bar.classList.toggle("indet", pr.busy && !pr.total);
  bar.style.width = pr.busy && pr.total ? Math.max(4, 100 * pr.done / pr.total) + "%" : (pr.busy ? "" : "0");
  bar.style.marginLeft = "";
  document.getElementById("progText").textContent = pr.busy
    ? `${t("bg")}${tr(pr.label) || t("bg_working")}${pr.total ? t("bg_steps", pr.done, pr.total) : ""}${pr.queued ? t("bg_more", pr.queued) : ""}`
    : "";
  const btn = document.getElementById("refreshBtn");
  btn.disabled = pr.refresh_queued;
  btn.textContent = pr.refresh_queued ? t("refreshing") : t("refresh");
}

async function loadJobs(){
  const res = await fetch("api/jobs");
  lastData = await res.json();
  version = lastData.version;
  render();
  renderProgress(lastData.progress);
}

async function tick(){
  clearTimeout(tickTimer);
  try{
    const st = await (await fetch("api/status")).json();
    renderProgress(st.progress);
    if (st.version !== version) await loadJobs();
  }catch(e){
    document.getElementById("progText").textContent = t("server_down");
  }
  tickTimer = setTimeout(tick, busy ? 700 : 3000);
}
function kick(){ clearTimeout(tickTimer); tickTimer = setTimeout(tick, 150); }

applyStatic();
renderFilters();
renderUpdated();
tick();
</script>
</body>
</html>
