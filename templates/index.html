<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HPC Job Dashboard</title>
<style>
  :root{
    --bg:#0f1117; --panel:#161922; --panel2:#1b1f2a; --border:#2a2e3a; --text:#e6e8ee; --muted:#8b90a0;
    --accent:#5b8def; --row-hover:#1e2330; --child:#12151d;
    --ok:#2ecc71; --warn:#f1c40f; --bad:#e74c3c;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);font-size:13px;}
  header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--border);background:var(--panel);flex-wrap:wrap;}
  header h1{font-size:15px;margin:0 6px 0 0;font-weight:600;}
  .muted{color:var(--muted);font-size:12px;}
  .spacer{flex:1;}
  select,input[type=text],input[type=number]{background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:5px 9px;font-size:13px;}
  input[type=text]{width:220px;}
  button{background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:5px 11px;font-size:13px;cursor:pointer;}
  button:hover{border-color:var(--accent);}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  main{padding:14px 16px 40px;}
  h2{font-size:13px;font-weight:600;margin:0 0 8px;color:var(--muted);display:flex;align-items:center;gap:8px;}
  h2 button{font-size:11px;padding:1px 8px;}
  h2 .muted{font-weight:400;}
  .errbox{background:#3a1f1f;border:1px solid #6b2b2b;color:#ff9d9d;padding:7px 10px;border-radius:6px;margin-bottom:12px;font-size:12px;}
  .errbox div{word-break:break-all;}

  /* QoS 面板 */
  #ovGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(760px,1fr));gap:12px;margin-bottom:18px;}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:8px;overflow-x:auto;}
  .card-h{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--border);font-weight:600;}
  .card-h .muted{font-weight:400;}
  .card-err{padding:10px 12px;color:#ff9d9d;font-size:12px;word-break:break-all;}
  table{border-collapse:collapse;width:100%;}
  th{font-weight:500;color:var(--muted);text-align:left;font-size:12px;padding:6px 10px;border-bottom:1px solid var(--border);white-space:nowrap;background:var(--panel);}
  td{padding:5px 10px;border-bottom:1px solid var(--border);white-space:nowrap;vertical-align:middle;}
  .qos td{font-variant-numeric:tabular-nums;}
  .qos tbody tr{cursor:pointer;}
  .qos tbody tr:hover{background:var(--row-hover);}
  .qos tr.sel{background:#22304d;}
  .qos tr.idle td.qname{color:var(--muted);}
  .qos .note{display:block;color:var(--muted);font-size:11px;white-space:normal;}
  .qos .lim{color:var(--muted);}
  .qos .tres{white-space:normal;word-break:break-all;min-width:110px;font-size:12px;}
  .qos tr.full td.mine{color:var(--warn);}
  .qos tr.subfull td.mine{color:var(--bad);}
  .qos tr.down td.qname{color:#ff9d9d;}
  .qos tr.mine-row td.qname{font-weight:600;}
  .qos .idle-n{color:var(--ok);}
  #partChip{cursor:pointer;}
  .n-r{color:var(--ok);} .n-pd{color:var(--warn);} .n-0{color:#4a5063;}
  .tag{display:inline-block;font-size:10px;padding:0 5px;border-radius:3px;margin-left:5px;vertical-align:1px;}
  .tag.full{background:#4a3b10;color:var(--warn);} .tag.subfull{background:#4a1c1c;color:#ff9d9d;}
  .tag.cfg{background:#1f2c48;color:#9db8f5;}

  /* Job 表格 */
  .tablewrap{background:var(--panel);border:1px solid var(--border);border-radius:8px;overflow-x:auto;}
  #jobs th{position:sticky;top:0;}
  #jobs tbody tr.grp:hover, #jobs tbody tr.one:hover{background:var(--row-hover);}
  #jobs tr.child{background:var(--child);}
  #jobs tr.child td{border-bottom-color:#1d212b;}
  #jobs tr.child:has(+ tr.detail) td{border-bottom:none;padding-bottom:2px;}
  #jobs tr.child td.name{padding-left:28px;color:var(--muted);}
  #jobs tr.flash{animation:flash 1.6s ease-out;}
  @keyframes flash{0%{background:#2c4a80;}100%{background:transparent;}}
  td.tog{width:26px;padding:0 0 0 10px;color:var(--muted);cursor:pointer;user-select:none;}
  tr.grp td{cursor:pointer;}
  .tri{display:inline-block;transition:transform .12s;font-size:10px;}
  .open .tri{transform:rotate(90deg);}
  td.name{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;max-width:420px;overflow:hidden;text-overflow:ellipsis;}
  .count{color:var(--muted);font-family:inherit;font-size:11px;margin-left:6px;}
  td.jid{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;cursor:copy;}
  td.jid:hover{color:var(--accent);}
  td.part{max-width:180px;overflow:hidden;text-overflow:ellipsis;color:var(--muted);}
  td.where{max-width:260px;overflow:hidden;text-overflow:ellipsis;}
  td.num{font-variant-numeric:tabular-nums;}
  .st{display:inline-block;padding:1px 7px;border-radius:10px;font-size:11px;font-weight:600;color:#111;background:var(--c);}
  .st.light{color:#fff;}
  .cnts{margin-left:6px;}
  .cnt{display:inline-block;font-size:10px;padding:0 5px;margin-right:3px;border-radius:3px;border:1px solid var(--c);color:var(--c);font-variant-numeric:tabular-nums;}
  .dep{display:inline-flex;align-items:center;gap:4px;margin-right:8px;cursor:pointer;color:var(--muted);}
  .dep:hover{color:var(--accent);}
  .dep b{font-weight:400;color:var(--text);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--c);flex:none;}
  .empty{padding:24px;text-align:center;color:var(--muted);}
  /* 排队积压 */
  /* QoS → 分区 树 */
  .qos td.tog{width:22px;padding:0 0 0 10px;}
  .qos tr.lvl1 td{background:var(--child);border-bottom-color:#1d212b;}
  .qos tr.lvl1 td.qname{padding-left:30px;color:var(--text);}
  .qos tr.lvl1 td.qname::before{content:"└ ";color:#4a5063;}
  .qos tr.lvl1.idle td.qname{color:var(--muted);}
  .qos tr.other td.qname{color:var(--muted);font-style:italic;}
  .qos tr.open .tri{transform:rotate(90deg);}
  .qos td.limits{white-space:normal;color:var(--muted);font-size:12px;min-width:150px;}
  .qos td.limits b{font-weight:500;color:var(--text);}
  .h-ok{color:var(--ok);} .h-mid{color:var(--warn);} .h-bad{color:#ff7b6b;}
  .gpuv{margin-right:10px;white-space:nowrap;}
  .gpuv .t{color:var(--muted);font-size:11px;}
  .card-foot{padding:7px 12px;font-size:12px;color:var(--muted);border-top:1px solid var(--border);}
  .card-foot b{color:var(--text);font-weight:500;}
  details.cut{border-top:1px solid var(--border);}
  details.cut summary{padding:7px 12px;cursor:pointer;font-size:12px;color:var(--warn);}
  details.cut table td{font-size:12px;}
  details.how{margin:-2px 0 10px;font-size:12px;color:var(--muted);}
  details.how summary{cursor:pointer;}
  details.how div{padding:6px 0 0 14px;line-height:1.6;max-width:900px;}
  .stale-note{padding:6px 12px;font-size:12px;color:var(--warn);border-bottom:1px solid var(--border);}
  .tag.auth{background:#4a3b10;color:var(--warn);}
  #jobs tr.stale td{opacity:.55;}
  .est{margin-left:6px;font-size:12px;}
  /* 后台进度 */
  #prog{position:absolute;left:0;right:0;bottom:-1px;height:3px;background:transparent;overflow:hidden;}
  #progBar{height:100%;width:0;background:var(--accent);transition:width .3s;}
  #prog.busy #progBar.indet{width:30%;animation:indet 1.2s linear infinite;}
  @keyframes indet{0%{margin-left:-30%;}100%{margin-left:100%;}}
  #progText{color:#9db8f5;}
  button:disabled{opacity:.6;cursor:default;}
  .card-h .at{margin-left:auto;font-weight:400;}

  /* job 目录信息 */
  #jobs tr.detail td{padding:0 10px 5px;line-height:1.5;background:var(--child);white-space:normal;border-bottom:1px solid var(--border);}
  #jobs tr.child + tr.detail td{border-top:none;}
  .insp{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;font-size:12px;padding-left:18px;}
  .insp .path{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--muted);cursor:copy;word-break:break-all;}
  .insp .path:hover{color:var(--accent);}
  .insp .ff b{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:500;}
  .insp .v{font-variant-numeric:tabular-nums;}
  .insp .last{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--muted);font-size:11px;}
  .insp button{font-size:11px;padding:1px 8px;}
  .ok-tag{display:inline-block;font-size:10px;padding:0 5px;border-radius:3px;background:#173a26;color:var(--ok);}
  .bad-tag{display:inline-block;font-size:10px;padding:0 5px;border-radius:3px;background:#4a1c1c;color:#ff9d9d;max-width:420px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:middle;}
  .insp-full{display:grid;grid-template-columns:minmax(260px,1fr) 2fr;gap:10px;margin:8px 0 2px 18px;}
  .insp-full pre{margin:0;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:8px;font-size:11px;line-height:1.45;max-height:340px;overflow:auto;white-space:pre;}
  .insp-full h4{margin:0 0 4px;font-size:11px;font-weight:500;color:var(--muted);}
  .insp-full .tails{display:flex;flex-direction:column;gap:8px;min-width:0;}
  @media (max-width:900px){ .insp-full{grid-template-columns:1fr;} }
  /* 提醒 */
  #alerts{margin-bottom:12px;}
  .alertbox{background:#2e2610;border:1px solid #5c4a14;border-radius:6px;padding:6px 10px;font-size:12px;}
  .alertbox .ah{color:var(--warn);font-weight:600;margin-right:8px;}
  .alertbox .ah button{font-size:11px;padding:0 7px;margin-left:8px;font-weight:400;}
  .alertbox .ai{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline;padding:2px 0;}
  .alertbox .ai .k{display:inline-block;font-size:10px;padding:0 5px;border-radius:3px;background:#4a3b10;color:var(--warn);}
  .alertbox .ai .k.big{background:#4a1c1c;color:#ff9d9d;}
  .alertbox .ai .p{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--muted);word-break:break-all;cursor:copy;}
  .alertbox .ai .p:hover{color:var(--accent);}
  .alertbox .ai a{color:var(--text);cursor:pointer;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;text-decoration:underline dotted;}
  .alertbox .ai a:hover{color:var(--accent);}
  .insp .size.big{color:#ff9d9d;font-weight:600;}
  /* 排队历史 */
  #histH{margin-top:22px;}
  .hist-ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px;}
  #histStats{margin-bottom:12px;}
  .hist td{font-variant-numeric:tabular-nums;}
  .hist.stats tbody tr{cursor:pointer;}
  .hist.stats tbody tr:hover{background:var(--row-hover);}
  .hist.stats tr.sel{background:#22304d;}
  .hist td.name{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;max-width:320px;overflow:hidden;text-overflow:ellipsis;}
  .hist .more{padding:8px 12px;color:var(--muted);font-size:12px;}
  /* 排队预测 */
  #mlH{margin-top:22px;}
  #mlStatus{padding:10px 12px;margin-bottom:10px;font-size:13px;line-height:1.7;}
  #mlStatus table{margin-top:6px;}
  #mlForm label{font-size:13px;color:var(--muted);}
  #mlForm input[type=number]{width:72px;}
  #mlResult tr.best td{background:#1d3324;}
  .ml td{font-variant-numeric:tabular-nums;}
  .ml .rng{color:var(--muted);font-size:12px;margin-left:4px;}
  .est.ml-est .lbl{color:#b39ddb;}
  .dep-n{color:#b39ddb;}
  #mlRec{font-size:13px;font-weight:400;}
  #mlRec b{color:var(--ok);}
  #mlBest{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 10px;font-size:13px;}
  #mlBest .c{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:4px 10px;}
  #autoSel{font-size:12px;}
  #langBtn{font-size:12px;padding:5px 9px;}
  #toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--border);padding:6px 14px;border-radius:6px;opacity:0;transition:opacity .2s;pointer-events:none;}
  #toast.show{opacity:1;}
  @media (max-width:640px){
    header{padding:8px 16px;} main{padding:12px 16px 40px;}
    input[type=text]{width:100%;}
    #ovGrid{grid-template-columns:1fr;}
    .card{overflow-x:auto;}
  }
</style>
</head>
<body>

<header>
  <h1>HPC Job Dashboard</h1>
  <span class="muted" id="updated"></span>
  <select id="clusterFilter"></select>
  <select id="qosFilter"></select>
  <select id="stateFilter">
    <option value="" data-i18n="f_all_states"></option>
    <option value="active" data-i18n="f_active"></option>
    <option value="running" data-i18n="f_running"></option>
    <option value="pending" data-i18n="f_pending"></option>
    <option value="done" data-i18n="f_done"></option>
    <option value="failed" data-i18n="f_failed"></option>
  </select>
  <input type="text" id="searchBox" data-i18n-ph="search_ph">
  <span class="spacer"></span>
  <span class="muted" id="progText"></span>
  <span class="muted" id="summary"></span>
  <select id="autoSel"></select>
  <button id="refreshBtn" class="primary"></button>
  <button id="langBtn" title="Language / 语言"></button>
  <div id="prog"><div id="progBar"></div></div>
</header>

<main>
  <div id="alerts"></div>
  <div id="errors"></div>

  <h2><span data-i18n="ov_title"></span> <button id="ovToggle"></button>
    <span class="muted" data-i18n="ov_hint"></span></h2>
  <details class="how"><summary data-i18n="ov_how"></summary><div data-i18n-html="ov_how_body"></div></details>
  <details class="how"><summary data-i18n="bl_how"></summary><div data-i18n-html="bl_how_body"></div></details>
  <div id="ovGrid"></div>

  <h2 id="mlH"><span data-i18n="ml_title"></span> <button id="mlToggle"></button>
    <button id="mlTrain"></button> <span id="mlRec"></span> <span class="muted" data-i18n="ml_hint"></span></h2>
  <div id="mlWrap">
    <details class="how"><summary data-i18n="ml_how"></summary><div data-i18n-html="ml_how_body"></div></details>
    <div id="mlStatus" class="card"></div>
    <form class="hist-ctl" id="mlForm">
      <select id="mlCluster"></select>
      <label>CPU <input type="number" id="mlCpus" min="1" step="1"></label>
      <label>GPU <input type="number" id="mlGpus" min="0" step="1"></label>
      <label><span data-i18n="ml_nodes"></span> <input type="number" id="mlNodes" min="1" step="1"></label>
      <label><span data-i18n="ml_time"></span> <input type="number" id="mlTime" min="0" step="0.5"></label>
      <button type="submit" class="primary" data-i18n="ml_go"></button>
      <span class="muted" data-i18n="ml_form_hint"></span>
    </form>
    <div id="mlBest"></div>
    <div id="mlResult" class="tablewrap"></div>
  </div>

  <h2>Jobs <button id="expandAll" data-i18n="expand_all"></button><button id="collapseAll" data-i18n="collapse_all"></button>
    <span class="tag cfg" id="partChip" style="display:none"></span>
    <span class="muted" data-i18n="jobs_hint"></span></h2>
  <div class="tablewrap">
    <table id="jobs">
      <thead><tr>
        <th></th><th data-i18n="col_name"></th><th data-i18n="col_cluster"></th><th>Job ID</th><th data-i18n="col_state"></th>
        <th>QoS</th><th data-i18n="col_partition"></th><th data-i18n="col_where"></th><th data-i18n="col_time"></th>
        <th data-i18n="col_when"></th><th data-i18n="col_deps"></th>
      </tr></thead>
      <tbody id="jobsBody"><tr><td colspan="11" class="empty">…</td></tr></tbody>
    </table>
  </div>

  <h2 id="histH"><span data-i18n="hist_title"></span> <button id="histToggle"></button>
    <span class="muted" data-i18n="hist_hint"></span></h2>
  <div id="histWrap">
    <div class="hist-ctl">
      <select id="histDays">
        <option value="7" data-i18n="hist_d7"></option>
        <option value="30" data-i18n="hist_d30"></option>
        <option value="90" data-i18n="hist_d90"></option>
        <option value="365" data-i18n="hist_d365"></option>
        <option value="" data-i18n="hist_dall"></option>
      </select>
      <select id="histCluster"></select>
      <input type="text" id="histSearch" data-i18n-ph="hist_search_ph">
      <span class="muted" id="histBackup"></span>
    </div>
    <div id="histStats" class="card"></div>
    <div id="histJobs" class="tablewrap"></div>
  </div>
</main>
<div id="toast"></div>

<script>
// ---------------- 中英文 ----------------
// 页面上的文字都在这里；后端发来的消息是 {zh, en}，用 tr() 取当前语言
const I18N = {
  zh: {
    never_refreshed: "还没刷新过",
    updated_at: s => "数据更新于 " + s,
    all_clusters: "所有集群", all_qos: "所有 QoS",
    f_all_states: "全部状态", f_active: "活跃（运行+排队）", f_running: "运行中", f_pending: "排队中",
    f_done: "已结束", f_failed: "最近一个失败/取消",
    search_ph: "搜索 job id / 名字 / 节点 / QoS",
    refresh: "立即刷新", refreshing: "刷新中…", queued_btn: "已加入队列",
    collapse: "收起", expand: "展开", expand_all: "全部展开", collapse_all: "全部收起", show_all: "显示全部",
    bl_title: "积压", bl_how: "排队积压怎么算的（每个分区现在的活要多久才能消化完，每几分钟更新一次）",
    bl_how_body: `把分区里所有 job 的（剩余时长 × 核数）加起来，除以分区总核数，就是"假设完美排满、把现有的活清空要多久"；GPU 同理按卡算。<br>
      范围的前一个数（Local）只算这个分区自己；后一个数（Global）把共享同一批节点的分区都算上（比如 gpu / gpulowpri / gpu-devel 共用一批卡）。真实等待一般落在中间。<br>
      下面 Job 表里你排队的 job 会显示"积压"：取 CPU / GPU 里最慢的那个（瓶颈），多个候选分区取最快的那个。这只是粗略参考：没算优先级、fairshare 和 backfill。<br>
      "插队"= 和你同分区、比你最早排队的 job 晚提交、却已经在跑的别人的 job，通常是靠 backfill（时间短 / 资源少）插进去的。`,
    jobs_hint: "同集群、同名字的 job 收在一行里 · 展开后会读取每个 job 的工作目录 · 点 Job ID / 路径复制",
    col_name: "名字", col_cluster: "集群", col_state: "状态", col_partition: "分区", col_where: "节点 / 原因",
    col_time: "用时 / 限时", col_when: "时间", col_deps: "依赖",
    w_start: "开始", w_est: "预计", w_submit: "提交", w_end: "结束", w_backlog: "积压",
    limit_blocked: "卡在限额",
    limit_tip: r => `卡在限额：${r}\n账户/QoS 的数量或资源上限到顶了，要等你自己（或同组）前面的 job 跑完，积压估计不适用。`,
    est_tip: (p, all, b) => `排队积压估计（分区 ${p}）\n${all}\n瓶颈: ${b}`,
    not_in_history: " (不在历史窗口内)",
    tip_state: "状态", tip_partition: "分区", tip_nodes: "节点", tip_reason: "原因", tip_submit: "提交",
    tip_start: "开始", tip_end: "结束", tip_deps: "依赖", tip_source: "来源",
    click_copy: "点击复制", click_copy_path: "点击复制路径",
    n_running_more: n => `+${n} 个在跑`, n_jobs: n => `${n} 个 job`, current: "↳ 当前",
    no_match: "没有符合条件的 job", summary: (g, n) => `${g} 组 · ${n} 个 job`,

<b>特征</b>：申请的核数 / GPU / 节点 / 时长；<b>可以排队那一刻</b>该 QoS 全集群的运行 / 排队数、你自己的运行 / 排队数、该分区的积压估计（CPU / GPU）、Slurm 自己的估计和原因、已经排了多久。“那一刻”取第一次看到它排队时记下的状态，没有就用前后 2 小时内最近的刷新快照 —— 所以刷新越频繁（config.yaml 里 <code>auto_refresh_minutes</code>），数据越好。<br>

    ov_how: "How do QoS and partitions relate?",
    ov_how_body: `A <b>partition</b> is a set of nodes (where a job runs); node / CPU usage and the backlog are per partition. A <b>QoS</b> is a set of rules (max running / submitted jobs per user, max wall time, resource caps, priority).
      Every job picks one QoS and one (or several) partitions, so the relation is <b>many-to-many</b>, not containment. Each QoS lists the partitions it can use:<br>
      · if a partition's AllowQos names the allowed QoS (e.g. young: cpu only allows freecpu / test), that rule is used;<br>

// ---------------- 分组 ----------------
function buildGroups(jobs){
  const map = new Map();
  for (const j of jobs){
    // 分隔符不能用 \u0000：写进 data-group 属性时浏览器会把它换成 \uFFFD，点击时就对不上了
    const k = j.cluster + "/" + j.name;
    if (!map.has(k)) map.set(k, {key:k, cluster:j.cluster, name:j.name, jobs:[]});
    map.get(k).jobs.push(j);
  }
  const groups = [...map.values()];
  for (const g of groups){
    g.jobs.sort((a, b) => idNum(a) - idNum(b) || a.id.localeCompare(b.id));
    // 代表这一组的 job：正在跑的 > 下一个排队的 > 最后一个
    g.rep = g.jobs.find(j => ACTIVE.has(j.state)) || g.jobs.find(j => PEND.has(j.state)) || g.jobs[g.jobs.length - 1];
    g.rank = ACTIVE.has(g.rep.state) ? 0 : PEND.has(g.rep.state) ? 1 : 2;
    g.maxId = Math.max(...g.jobs.map(idNum));
    g.counts = {};
    for (const j of g.jobs) g.counts[j.state] = (g.counts[j.state] || 0) + 1;
    g.qosList = [...new Set(g.jobs.map(j => j.qos).filter(Boolean))];
    g.nRunning = g.jobs.filter(j => ACTIVE.has(j.state)).length;
  }
  groups.sort((a, b) => a.rank - b.rank || a.cluster.localeCompare(b.cluster) || b.maxId - a.maxId);
  return groups;
}

function groupVisible(g){
  if (filters.cluster && g.cluster !== filters.cluster) return false;
  if (filters.qos){
    const [c, q] = filters.qos.split("|");
    if (g.cluster !== c || !g.jobs.some(j => j.qos === q)) return false;
  }
  if (filters.part){
    const [c, p] = filters.part.split("|");
    if (g.cluster !== c || !g.jobs.some(j => (j.partition || "").split(",").includes(p))) return false;
  }
  const s = g.rep.state;
  switch (filters.state){
    case "active":  if (g.rank > 1) return false; break;
    case "running": if (g.rank !== 0) return false; break;
    case "pending": if (!g.jobs.some(j => PEND.has(j.state))) return false; break;
    case "done":    if (g.rank !== 2) return false; break;
    case "failed":  if (g.rank !== 2 || !BAD.has(s)) return false; break;
  }
  if (filters.search){
    const q = filters.search.toLowerCase();
    const hit = g.jobs.some(j => [j.id, j.name, j.nodelist, j.qos, j.partition, j.cluster].join(" ").toLowerCase().includes(q));
    if (!hit) return false;
  }
  return true;
}

// ---------------- 单元格 ----------------
function whereCell(j){
  if (ACTIVE.has(j.state)) return esc(j.nodelist || "-");
  if (PEND.has(j.state)) return `<span class="muted">${esc(j.reason || "-")}</span>`;
  return `<span class="muted">${esc(j.nodelist || "")}</span>`;
}
function timeUsedCell(j){
  if (ACTIVE.has(j.state)) return `${esc(j.time_used)} <span class="muted">/ ${esc(j.time_limit || "-")}</span>`;
  if (PEND.has(j.state)) return `<span class="muted">— / ${esc(j.time_limit || "-")}</span>`;
  return esc(j.time_used || "-");
}
function mlCell(j){
  const m = j.ml_est;
  if (!m) return "";
  const [w20, w50, w80] = m.wait;
  const extra = (m.dep ? t("ml_tip_dep", fmtTime(m.dep_ready), m.dep_known) : "") + t("ml_tip_model", m.model, m.n_seen);
  const few = m.n_seen < 3, cls = few ? "n-0" : hCls(w50);
  const fewTag = few ? ` <span class="tag full">${t("ml_few")}</span>` : "";
  if (!m.start) return `<span class="est ml-est" title="${esc(t("ml_tip", "-", "-", fmtH(w50), m.partition, extra))}"><span class="lbl">${t("w_ml")}</span> <span class="${cls}">${t("ml_dep_after", fmtH(w50))}</span>${fewTag}</span>`;
  const tip = t("ml_tip", fmtTime(m.start[1]), `${fmtTime(m.start[0])} – ${fmtTime(m.start[2])}`, `${fmtH(w20)} – ${fmtH(w80)}`, m.partition, extra);
  return `<span class="est ml-est" title="${esc(tip)}"><span class="lbl">${t("w_ml")}</span> <span class="${cls}">${fmtTime(m.start[1])}</span>${fewTag}</span>`;
}
function whenCell(j){
  if (ACTIVE.has(j.state)) return `<span class="muted">${t("w_start")}</span> ${fmtTime(j.start)}`;
  if (PEND.has(j.state)){
    const base = (j.start ? `<span class="muted">${t("w_est")}</span> ${fmtTime(j.start)}` : `<span class="muted">${t("w_submit")}</span> ${fmtTime(j.submit)}`) + mlCell(j);
    if (j.never_run) return `${base}<span class="est h-bad" title="${esc(j.never_run + (NEVER_TIP[j.never_run] ? "\n" + t(NEVER_TIP[j.never_run]) : ""))}">${t("never_run_cell")}</span>`;
    // AssocGrpJobsLimit / QOSMaxGRESPerUser 这类：是你自己（或组）的额度满了，不是在等空位
    if (/^(Assoc|QOS)(Grp|Max)/.test(j.reason || "")){
      return `${base}<span class="est h-mid" title="${esc(t("limit_tip", j.reason))}">${t("limit_blocked")}</span>`;
    }
    const w = j.wait_est;
    if (!w) return base;
    const tip = t("est_tip", w.partition, w.all.map(e => `${e.label}: ${fmtH(e.min)} – ${fmtH(e.max)}`).join("  <  "), w.bottleneck.label);
    return `${base}<span class="est" title="${esc(tip)}"><span class="muted">${t("w_backlog")}</span> ${fmtRange(w.bottleneck.min, w.bottleneck.max)}</span>`;
  }
  return `<span class="muted">${t("w_end")}</span> ${fmtTime(j.end)}`;
}
function depsCell(j){
  if (!j.deps || !j.deps.length) return "";
  return j.deps.map(d => {
    if (!d.id) return `<span class="dep">${esc(d.type)}</span>`;
    const target = jobsByKey[j.cluster + ":" + d.id];
    const st = target ? target.state : "UNKNOWN";
    const sameName = target && target.name === j.name;
    const label = target ? (sameName ? "" : " " + target.name) : t("not_in_history");
    const tip = `${d.type}:${d.id}${d.status ? " (" + d.status + ")" : ""} → ${st}${target ? " " + target.name : ""}`;
    return `<span class="dep" data-jump="${esc(j.cluster + ":" + d.id)}" title="${esc(tip)}">`
      + `<span class="dot" style="--c:${colorFor(st)}"></span>${esc(d.type)} <b>#${esc(d.id)}</b>${esc(label)}</span>`;
  }).join("");
}
function jobTip(j){
  return [
    `#${j.id}  ${j.name}`, `${t("tip_state")}: ${j.state}`, `QoS: ${j.qos || "-"}  ${t("tip_partition")}: ${j.partition || "-"}`,

    j.dependency_raw ? `${t("tip_deps")}: ${j.dependency_raw}` : "", `${t("tip_source")}: ${j.source}`,
  ].filter(Boolean).join("\n");

// ---------------- job 目录信息 ----------------
const fmtSize = n => n < 1024 ? n + "B" : n < 1048576 ? (n / 1024).toFixed(0) + "K" : n < 1073741824 ? (n / 1048576).toFixed(1) + "M" : (n / 1073741824).toFixed(1) + "G";
const fnum = (v, d) => v === null || v === undefined ? "?" : v.toFixed(d);
const fexp = v => v === null || v === undefined ? "?" : v.toExponential(1);

function fileSummary(f){
  const p = f.parsed || {};
  const bits = [];
  if (p.ionic_step !== undefined) bits.push(`${t("ionic")} <span class="v">${p.ionic_step}</span>`, `F <span class="v">${fnum(p.F, 4)}</span>`, `dE <span class="v">${fexp(p.dE)}</span>`);
  if (p.elec_step !== undefined) bits.push(`${esc(p.elec_algo)} <span class="v">${p.elec_step}</span>`);
  if (p.mag !== undefined) bits.push(`mag <span class="v">${fnum(p.mag, 2)}</span>`);
  if (p.converged) bits.push(`<span class="ok-tag">${t("converged")}</span>`);
  if (p.error) bits.push(`<span class="bad-tag" title="${esc(p.error)}">${esc(p.error)}</span>`);
  if (!bits.length && p.last_line) bits.push(`<span class="last" title="${esc(p.last_line)}">${esc(p.last_line.slice(0, 90))}</span>`);
  return `<span class="ff"><b>${esc(f.name)}</b> <span class="muted">${esc(f.mtime || "")}</span> ${bits.join(" · ")}</span>`;
}

// OUTCAR 里最后一个电子步（LOOP:）/ 离子步（LOOP+:）的 cpu time 和 real time
function loopSummary(lp){
  if (!lp || !lp.elec) return "";
  const e = lp.elec, i = lp.ionic;
  const tip = [`LOOP:  cpu ${e.cpu}s · real ${e.real}s`, i ? `LOOP+: cpu ${i.cpu}s · real ${i.real}s` : "", lp.warn ? tr(lp.warn) : ""].filter(Boolean).join("\n");
  return `<span class="ff" title="${esc(tip)}"><b>LOOP</b> cpu <span class="v">${e.cpu.toFixed(0)}s</span> · real <span class="v${lp.warn ? " size big" : ""}">${e.real.toFixed(0)}s</span>`
    + (lp.warn ? ` <span class="bad-tag">${t("loop_slow")}</span>` : "") + `</span>`;
}

function detailRow(j){
  const k = jobKey(j), ins = (lastData.inspect || {})[k], pending = pendingInspect.has(k);
  const reload = `<button data-insp-reload="${esc(k)}"${pending ? " disabled" : ""}>${pending ? t("reading") : ins ? t("reread") : t("read")}</button>`;
  let body;
  if (!ins){
    body = pending ? `<span class="muted">${t("queued_read")}</span>` : `<span class="muted">${t("not_read")}</span> ${reload}`;
  } else if (ins.error){
    body = `<span class="bad-tag" title="${esc(tr(ins.error))}">${esc(tr(ins.error))}</span> ${reload}`;
  } else {
    const path = `<span class="path" data-copy="${esc(ins.dir)}" title="${t("click_copy_path")}">${esc(ins.dir)}</span>`;
    const limitGb = (lastData.settings || {}).dir_size_warn_gb || 30;
    const sizeHtml = ins.size_kb === null || ins.size_kb === undefined
      ? (ins.exists ? `<span class="muted" title="${t("du_fail")}">${t("size_unknown")}</span>` : "")
      : `<span class="size${ins.size_kb > limitGb * 1048576 ? " big" : ""}" title="du -sk">${fmtSize(ins.size_kb * 1024)}</span>`;
    const shared = ins.shared && ins.shared.length
      ? `<span class="muted">${t("same_dir")}${ins.shared.slice(0, 6).map(x => `<a class="dep" data-jump="${esc(j.cluster + ":" + x)}"><b>#${esc(x)}</b></a>`).join("")}${ins.shared.length > 6 ? t("and_n", ins.shared.length) : ""}</span>` : "";
    if (!ins.exists){
      body = `${path} <span class="bad-tag">${t("no_dir")}</span> ${reload}`;
    } else {
      const files = (ins.files.length ? ins.files.map(fileSummary).join("") : `<span class="muted">${t("no_files")}</span>`) + loopSummary(ins.loop);
      const open = detailOpen.has(k);
      const manyFiles = ins.count > ((lastData.settings || {}).dir_files_warn || Infinity);
      body = `${path}${sizeHtml}<span class="${manyFiles ? "size big" : "muted"}">${t("n_files", ins.count ?? "?")}</span>${shared}${files}
        <button data-insp-toggle="${esc(k)}">${open ? t("hide_details") : t("details")}</button>${reload}
        <span class="muted">${t("read_at", localTime(ins.at))}</span>`;
      if (open){
        const ls = ins.ls.map(e => `${e.mtime}  ${fmtSize(e.size).padStart(6)}  ${e.name}${e.is_dir ? "/" : ""}`).join("\n");
        const more = ins.count > ins.ls.length ? t("ls_more", ins.count, ins.ls.length) : "";
        const tails = ins.files.map(f => `<div><h4>tail ${esc(f.name)}</h4><pre>${esc(f.tail.join("\n"))}</pre></div>`).join("");
        body += `</div><div class="insp-full"><div><h4>ls -lt</h4><pre>${esc(ls + more)}</pre></div><div class="tails">${tails || `<span class="muted">${t("no_files")}</span>`}</div>`;
      }
    }
  }
  return `<tr class="detail${j.stale ? " stale" : ""}"><td></td><td colspan="10"><div class="insp">${body}</div></td></tr>`;
}

async function requestInspect(keys, force){
  keys = keys.filter(k => force || !requested.has(k));
  if (!keys.length) return;
  keys.forEach(k => requested.add(k));
  try{
    await fetch("api/inspect", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({keys, force: !!force})});
  }catch(e){}
  kick();
}

// ---------------- 渲染 ----------------
function renderJobs(){
  const groups = buildGroups(lastData.jobs).filter(groupVisible);
  groupOfJob = {};
  const rows = [], wantInspect = [];
  let nJobs = 0;
  for (const g of groups){
    nJobs += g.jobs.length;
    g.jobs.forEach(j => groupOfJob[jobKey(j)] = g.key);
    if (g.jobs.length === 1){
      // 单个 job 也能展开，看它的工作目录
      const j = g.jobs[0], open = expanded.has(g.key);
      rows.push(`<tr class="grp one${open ? " open" : ""}${j.stale ? " stale" : ""}" data-group="${esc(g.key)}" id="row-${esc(jobKey(j))}"><td class="tog"><span class="tri">▶</span></td>${jobCells(j, esc(j.name))}</tr>`);
      if (open){ rows.push(detailRow(j)); wantInspect.push(jobKey(j)); }
      continue;
    }
    rows.push(groupRow(g));
    if (expanded.has(g.key)){
      for (const j of g.jobs){
        const isRep = j === g.rep;
        rows.push(`<tr class="child${j.stale ? " stale" : ""}"${isRep ? "" : ` id="row-${esc(jobKey(j))}"`}><td class="tog"></td>${jobCells(j, isRep ? t("current") : "↳")}</tr>`);
        rows.push(detailRow(j));
        wantInspect.push(jobKey(j));
      }
    }
  }
  document.getElementById("jobsBody").innerHTML = rows.join("")
    || `<tr><td colspan="11" class="empty">${t("no_match")}</td></tr>`;
  document.getElementById("summary").textContent = t("summary", groups.length, nJobs);
  // 展开着的 job 如果还没读过目录，就请求后台去读（后台会跳过已经读过的）
  const ins = lastData.inspect || {};
  const need = wantInspect.filter(k => !ins[k] && !pendingInspect.has(k));
  if (need.length) requestInspect(need, false);
}

// ---------------- QoS → 分区（合并了 QoS 面板、分区表和排队积压）----------------
const nCell = (v, cls) => v === null || v === undefined ? `<span class="n-0">—</span>` : `<span class="${v ? cls : "n-0"}">${v}</span>`;
// 运行 / 排队；"我的"里等依赖的 job 不算排队，放在运行数后面的括号里：2 (+5) / 98
const depTag = d => d ? ` <span class="dep-n" title="${esc(t("dep_tip"))}">(+${d})</span>` : "";
const pairCell = (r, m) => {
  const pd = r[m + "_pending"], dep = r[m + "_dep"] || 0;
  return `${nCell(r[m + "_running"], "n-r")}${depTag(dep)} / ${nCell(pd === null || pd === undefined ? pd : pd - dep, "n-pd")}`;
};
// 节点 / CPU：已用 / 空闲 / 总数（只有 scontrol 时只有总数）
const useCell = x => !x ? `<span class="n-0">—</span>` : x.idle === undefined ? `<span class="muted">${x.total}</span>`
  : `${x.alloc} / <span class="${x.idle ? "idle-n" : "n-0"}">${x.idle}</span> / ${x.total}${x.other ? ` <span class="muted" title="${esc(t("nodes_tip"))}">(+${x.other})</span>` : ""}`;
function limitsText(l){
  if (!l) return "";
  return [l.max_jobs_pu && `MaxJobs <b>${esc(l.max_jobs_pu)}</b>`, l.max_submit_pu && `MaxSubmit <b>${esc(l.max_submit_pu)}</b>`,
    l.max_tres_pu && `<b>${esc(l.max_tres_pu.replace(/,/g, ", "))}</b>`].filter(Boolean).join(" · ");
}
function treeIsOpen(key, def){ return key in treeOpen ? treeOpen[key] : def; }

function overviewCard(c){
  const dot = `<span class="dot" style="--c:${c.ok ? "var(--ok)" : c.need_input ? "var(--warn)" : "var(--bad)"}"></span>`;
  const authTag = c.need_input ? `<span class="tag auth">${t("need_2fa")}</span>` : "";
  if (c.never) return `<div class="card"><div class="card-h"><span class="dot" style="--c:#4a5063"></span>${esc(c.name)}</div><div class="card-err" style="color:var(--muted)">${t("never_fetched")}</div></div>`;
  const errHtml = c.ok ? "" : `<div class="card-err">${esc(tr(c.error) || "error")}</div>`
    + (c.stale_since ? `<div class="stale-note">${t("stale_note", localTime(c.stale_since))}</div>` : "");
  if (!c.ok && !c.stale_since) return `<div class="card"><div class="card-h">${dot}${esc(c.name)}${authTag}</div>${errHtml}</div>`;
  const ov = c.overview || {groups: (c.qos || []).map(q => ({qos: q.name, children: []})), other: [], partitions: {}, part_info: false};
  const qrow = Object.fromEntries((c.qos || []).map(q => [q.name, q]));
  const parts = Object.values(ov.partitions || {});
  // 这个集群有哪些列（没有数据的列整列不显示）
  const col = {
    all: hasF(c, "cluster_load"),
    nodes: parts.some(p => p.nodes), cpus: parts.some(p => p.cpus),
    bl: parts.some(p => p.backlog),
    lim: hasF(c, "qos_info"),
  };
  const nCols = 4 + col.all + col.nodes + col.cpus + 2 * col.bl + col.lim;
  const loadTip = c.load_private ? t("load_private_tip") : t("load_tip");
  const allCell = r => !col.all ? "" : `<td title="${esc(loadTip)}">${c.load_private ? `<span class="n-0">${t("hidden")}</span>` : pairCell(r, "all")}</td>`;

  const partRow = (pname, counts, under) => {
    const p = (ov.partitions || {})[pname] || {name: pname};
    const key = c.name + "|" + pname;
    const mine = counts.mine_running || counts.mine_pending;
    const down = p.avail && p.avail !== "up";
    const b = p.backlog;
    const gpu = !b ? `<span class="n-0">—</span>` : b.gpu.length
      ? b.gpu.map(g => `<span class="gpuv"><span class="t">${esc(g.type)}</span> ${fmtRange(g.min, g.max)}</span>`).join("") : `<span class="n-0">—</span>`;
    const pq = p.part_qos ? `<span title="${esc(t("part_qos_tip"))}">${esc(p.part_qos)}</span>${p.part_qos_limits ? ": " + limitsText(p.part_qos_limits) : ""}` : "";
    return `<tr class="lvl1 ${under} ${mine ? "mine-row" : "idle"} ${down ? "down" : ""} ${filters.part === key ? "sel" : ""}" data-part="${esc(key)}">
      <td class="tog"></td>
      <td class="qname">${esc(pname)}${p.default ? `<span class="tag cfg">${t("part_default")}</span>` : ""}${under && p.hidden ? `<span class="tag cfg">${t(p.hidden === "config" ? "hidden_config" : "hidden_empty")}</span>` : ""}${down ? `<span class="tag subfull">${esc(p.avail)}</span>` : ""}</td>
      <td class="mine" title="${esc(t("part_multi_tip"))}">${pairCell(counts, "mine")}</td>
      ${col.all ? `<td title="${esc(t("part_multi_tip"))}">${c.load_private ? `<span class="n-0">—</span>` : pairCell(counts, "all")}</td>` : ""}
      ${col.nodes ? `<td title="${esc(t("nodes_tip"))}">${useCell(p.nodes)}</td>` : ""}
      ${col.cpus ? `<td title="${esc(t("nodes_tip"))}">${useCell(p.cpus)}</td>` : ""}
      ${col.bl ? `<td title="${esc(t("bl_range_tip"))}">${b ? fmtRange(b.cpu_min, b.cpu_max) : `<span class="n-0">—</span>`}</td><td>${gpu}</td>` : ""}
      <td class="lim">${esc(p.time_limit || "-")}</td>
      ${col.lim ? `<td class="limits">${pq}</td>` : ""}
    </tr>`;
  };

  const rows = [];
  for (const g of ov.groups){
    const q = qrow[g.qos] || {name: g.qos};
    const key = c.name + "|" + q.name;
    const shown = g.children.filter(ch => !ch.hidden);  // 没有 job / config 隐藏的分区收在"其他分区"里
    const maxJ = parseInt(q.max_jobs_pu, 10), maxS = parseInt(q.max_submit_pu, 10);
    const full = maxJ && q.mine_running >= maxJ, subfull = maxS && q.mine_running + q.mine_pending >= maxS;
    const idle = !q.mine_running && !q.mine_pending;
    const open = shown.length && treeIsOpen(key, !idle || ov.groups.length === 1);
    const tags = (q.configured ? `<span class="tag cfg">config</span>` : "")
      + (subfull ? `<span class="tag subfull">${t("sub_full")}</span>` : full ? `<span class="tag full">${t("run_full")}</span>` : "");
    rows.push(`<tr class="lvl0 ${open ? "open" : ""} ${filters.qos === key ? "sel" : ""} ${subfull ? "subfull" : full ? "full" : ""} ${idle ? "idle" : ""}" data-qos="${esc(key)}">
      <td class="tog" ${shown.length ? `data-tree="${esc(key)}" title="${esc(t("n_parts", shown.length))}"` : ""}>${shown.length ? `<span class="tri">▶</span>` : ""}</td>
      <td class="qname">${esc(q.name)}${tags}${q.note ? `<span class="note">${esc(q.note)}</span>` : ""}${!open && shown.length ? `<span class="count">${esc(shown.map(x => x.name).join(", "))}</span>` : ""}</td>
      <td class="mine">${pairCell(q, "mine")}</td>
      ${allCell(q)}
      ${col.nodes ? "<td></td>" : ""}${col.cpus ? "<td></td>" : ""}${col.bl ? "<td></td><td></td>" : ""}
      <td class="lim" title="${esc(t("th_maxwall_tip"))}">${esc(q.max_wall || "-")}</td>
      ${col.lim ? `<td class="limits">${limitsText(q)}</td>` : ""}
    </tr>`);
    if (open) for (const ch of shown) rows.push(partRow(ch.name, ch, ""));
  }
  if (ov.other && ov.other.length){
    const key = c.name + "|\u0001other";  // 不会和 QoS 名字重复
    const open = treeIsOpen(key, false);
    rows.push(`<tr class="lvl0 other ${open ? "open" : ""}"><td class="tog" data-tree="${esc(key)}"><span class="tri">▶</span></td>
      <td class="qname" colspan="${nCols - 1}" data-tree="${esc(key)}" style="cursor:pointer" title="${esc(t("other_tip"))}">${t("other_parts", ov.other.length)}</td></tr>`);
    if (open) for (const pn of ov.other) rows.push(partRow(pn, ov.partitions[pn] || {}, "other"));
  }

  const sum = k => (c.qos || []).reduce((a, q) => a + (q[k] || 0), 0);
  const mr = sum("mine_running"), md = sum("mine_dep"), mp = sum("mine_pending") - md;
  // 积压：说明 / GPU 池 / 插队
  const bl = c.backlog;
  let foot = "";
  if (bl && !bl.ok) foot += `<div class="card-foot">${t("bl_title")}：${esc(tr(bl.error) || t("cant_estimate"))}</div>`;
  if (bl && bl.ok){
    if (bl.pools.length) foot += `<div class="card-foot">${t("gpu_pool")}` + bl.pools.map(pl =>
      t("pool_item", esc(pl.type), pl.cards, esc(pl.partitions.join(", ")))).join(" · ") + `</div>`;
    if (bl.cutters_total) foot += `<details class="cut"><summary>${t("cutters", bl.cutters_total, bl.cutters_total > bl.cutters.length ? bl.cutters.length : 0)}</summary>
      <table><thead><tr><th>Job ID</th><th>${t("col_partition")}</th><th>${t("th_account")}</th><th>${t("th_res")}</th><th>${t("th_limit")}</th><th>${t("th_reason")}</th></tr></thead><tbody>`
      + bl.cutters.map(x => `<tr><td>${esc(x.id)}</td><td>${esc(x.partition)}</td><td>${esc(x.account)}</td><td>${x.cpus}C/${x.gpus}G</td><td>${esc(x.limit)}</td><td>${esc(tr(x.reason))}</td></tr>`).join("")
      + `</tbody></table></details>`;
  }
  const blAt = bl && bl.fetched_at ? ` · ${t("bl_title")} ${localTime(bl.fetched_at)}` : "";
  return `<div class="card">
    <div class="card-h">${dot}${esc(c.name)}${authTag}<span class="muted">${t("mine_summary", mr, mp, md)}</span><span class="muted at">${c.ok ? t("data_at", localTime(c.at)) + blAt : ""}</span></div>
    ${errHtml}
    ${ov.part_info || !parts.length ? "" : `<div class="stale-note" style="color:var(--muted)">${esc(t("part_no_info", c))}</div>`}
    <table class="qos">
      <thead><tr><th></th><th>${esc(c.qos_label || "QoS")} / ${t("th_part")}</th><th>${t("th_mine")}</th>
        ${col.all ? `<th title="${esc(loadTip)}">${t("th_all")}</th>` : ""}
        ${col.nodes ? `<th title="${esc(t("nodes_tip"))}">${t("th_nodes")}</th>` : ""}
        ${col.cpus ? `<th title="${esc(t("nodes_tip"))}">${t("th_cpus2")}</th>` : ""}
        ${col.bl ? `<th title="${esc(t("bl_range_tip"))}">${t("th_cpu_bl")}</th><th>${t("th_gpu_bl")}</th>` : ""}
        <th>${t("th_tlimit")}</th>${col.lim ? `<th>${t("th_limits")}</th>` : ""}</tr></thead>
      <tbody>${rows.join("") || `<tr><td colspan="${nCols}" class="empty">${t("no_qos")}</td></tr>`}</tbody>
    </table>${foot}</div>`;
}

// 常见的"不会开始"原因的说明（其他的只显示原因码）
const NEVER_TIP = {DependencyNeverSatisfied: "nr_dep", PartitionTimeLimit: "nr_time", PartitionNodeLimit: "nr_nodes",
  BadConstraints: "nr_constraint", QOSNotAllowed: "nr_qos", JobHeldUser: "nr_held", JobHeldAdmin: "nr_held_admin"};
let alertsAll = false;
function renderAlerts(){
  const al = lastData.alerts || [];
  const el = document.getElementById("alerts");
  if (!al.length){ el.innerHTML = ""; return; }
  const limitGb = (lastData.settings || {}).dir_size_warn_gb || 30;
  const jobLinks = a => a.jobs.slice(0, 8).map(id => `<a data-jump="${esc(a.cluster + ":" + id)}">#${esc(id)}</a>`).join(" ") + (a.jobs.length > 8 ? t("and_n", a.jobs.length) : "");
  const path = a => `<span class="p" data-copy="${esc(a.dir)}" title="${t("click_copy_path")}">${esc(a.dir)}</span>`;
  const limitFiles = (lastData.settings || {}).dir_files_warn || 50;
  const item = a => a.type === "never_run"
    ? `<div class="ai"><span class="k big">${t("al_never_run")}</span><b>${esc(a.cluster)}</b> ${esc(a.reason)}${NEVER_TIP[a.reason] ? ` <span class="muted">${t(NEVER_TIP[a.reason])}</span>` : ""}: ${jobLinks(a)}${a.stale ? ` <span class="muted">${t("al_stale")}</span>` : ""}</div>`
    : a.type === "slow_loop"
    ? `<div class="ai"><span class="k big">${t("al_slow_loop")}</span><b>${esc(a.cluster)}</b> ${esc(tr(a.reason))}: ${jobLinks(a)} ${path(a)}</div>`
    : a.type === "waitlog_full"
    ? `<div class="ai"><span class="k big">${t("al_waitlog_full")}</span>${t("al_waitlog_full_msg", a.size_mb, a.limit_mb)} ${path(a)}</div>`
    : a.type === "same_dir"
    ? `<div class="ai"><span class="k">${t("al_same_dir")}</span><b>${esc(a.cluster)}</b> ${t("al_same_dir_msg", a.jobs.length)}${jobLinks(a)}${a.stale ? ` <span class="muted">${t("al_stale")}</span>` : ""} ${path(a)}</div>`
    : a.type === "many_files"
    ? `<div class="ai"><span class="k">${t("al_many_files")}</span><b>${esc(a.cluster)}</b> ${t("n_entries", a.count)} &gt; ${limitFiles}: ${jobLinks(a)} ${path(a)}</div>`
    : `<div class="ai"><span class="k big">${t("al_big_dir")}</span><b>${esc(a.cluster)}</b> ${fmtSize(a.size_kb * 1024)} &gt; ${limitGb}G: ${jobLinks(a)} ${path(a)}</div>`;
  const shown = alertsAll ? al : al.slice(0, 4);
  el.innerHTML = `<div class="alertbox"><span class="ah">${t("alerts", al.length)}${al.length > 4 ? `<button id="alertsMore">${alertsAll ? t("collapse") : t("show_all")}</button>` : ""}</span>${shown.map(item).join("")}</div>`;
}
document.getElementById("alerts").addEventListener("click", e => {
  if (e.target.id === "alertsMore"){ alertsAll = !alertsAll; renderAlerts(); return; }
  const copy = e.target.closest("[data-copy]");
  if (copy){ copyText(copy.dataset.copy).then(() => toast(t("copied_path"))); return; }
  const jump = e.target.closest("[data-jump]");
  if (jump) jumpTo(jump.dataset.jump);
});

function renderAuto(){

  if (!opts.includes(a.minutes)) opts.push(a.minutes);

  sel.innerHTML = opts.map(m => `<option value="${m}">${label(m)}</option>`).join("");
  sel.value = String(a.minutes);
  sel.title = a.next ? t("auto_next", new Date(a.next).toLocaleString([], {month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit"})) : "";
}
document.getElementById("autoSel").addEventListener("change", async e => {
  try{ await fetch("api/settings", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({auto_refresh_minutes: +e.target.value})}); }catch(err){}
  kick();
});

function render(){
  if (!lastData) return;
  jobsByKey = {};
  lastData.jobs.forEach(j => jobsByKey[jobKey(j)] = j);
  pendingInspect = new Set(lastData.inspect_pending || []);
  renderFilters(); renderAlerts(); renderErrors(); renderOverview(); renderModel(); renderJobs(); renderUpdated(); renderAuto();
}

function setFilter(k, v){ filters[k] = v; savePref("filters", {...filters, search: ""}); render(); }
document.getElementById("ovGrid").addEventListener("click", e => {
  const tog = e.target.closest("[data-tree]");
  if (tog){
    const k = tog.dataset.tree, row = tog.closest("tr");
    treeOpen[k] = !row.classList.contains("open");
    savePref("treeOpen", treeOpen); renderOverview(); return;
  }
  if (e.target.closest("details")) return;
  const part = e.target.closest("tr[data-part]");
  if (part){ setFilter("part", filters.part === part.dataset.part ? "" : part.dataset.part); return; }
  const q = e.target.closest("tr[data-qos]");
  if (q) setFilter("qos", filters.qos === q.dataset.qos ? "" : q.dataset.qos);
});
document.getElementById("partChip").addEventListener("click", () => setFilter("part", ""));
document.getElementById("ovToggle").addEventListener("click", () => { ovCollapsed = !ovCollapsed; savePref("ovCollapsed", ovCollapsed); renderOverview(); });

// ---------------- 排队预测 ----------------
let mlCollapsed = loadPref("mlCollapsed", true);
let mlForm = Object.assign({cluster: "", cpus: 64, gpus: 0, nodes: 1, time_h: 24}, loadPref("mlForm", {}));
let mlItems = null, mlErr = null, mlKey = "";  // mlKey：上次自动算推荐时的 数据|模型|参数
const pct = x => x === null || x === undefined ? "—" : Math.round(x * 100) + "%";
const scoreTxt = (s, cov) => s ? `${pct(s.hit)} / ${fmtH(s.mae_h)}${cov ? " / " + pct(s.coverage) : ""}` : `<span class="n-0">—</span>`;

function renderModel(){
  const m = (lastData && lastData.model) || {enabled: false};
  document.getElementById("mlWrap").style.display = mlCollapsed ? "none" : "";
  document.getElementById("mlToggle").textContent = mlCollapsed ? t("expand") : t("collapse");
  const tb = document.getElementById("mlTrain");
  tb.style.display = m.enabled && m.available ? "" : "none";
  tb.disabled = !!m.training;
  tb.textContent = m.training ? t("ml_training") : t("ml_train");
  const recKey = m.meta ? [lastData.updated_at, m.meta.trained_at, JSON.stringify(mlForm)].join("|") : "";
  if (recKey && recKey !== mlKey){ mlKey = recKey; runSuggest(); }
  if (!m.meta){ mlItems = null; document.getElementById("mlRec").innerHTML = ""; }
  if (mlCollapsed) return;
  const st = document.getElementById("mlStatus");
  const meta = m.meta;
  let html = "";
  if (!m.enabled) html = t("ml_disabled");
  else if (!m.available) html = t("ml_need_sklearn");
  else if (!meta) html = t("ml_none");
  else {
    html = t("ml_meta", fmtTime(meta.trained_at), meta.n_samples, meta.n_started, meta.n_censored, meta.seconds);
    const bt = meta.metrics;
    if (!bt) html += ` · ${t("ml_bt_none")}`;
    else {
      const row = (name, b, c) => `<tr><td>${esc(name)}</td><td>${c ? esc(t("ml_use")[c.model] || c.model) : ""}</td>
        <td>${c ? `${c.samples} (${c.with_state})` : meta.n_samples}</td>
        <td>${scoreTxt(b.model, true)}</td><td>${scoreTxt(b.history)}</td>
        <td title="${b.slurm ? esc(`n=${b.slurm.n}; ${t("w_ml")}: ${scoreTxt(b.model_on_slurm)}`) : ""}">${scoreTxt(b.slurm)}</td>
        <td title="${b.backlog ? esc(`n=${b.backlog.n}; ${t("w_ml")}: ${scoreTxt(b.model_on_backlog)}`) : ""}">${scoreTxt(b.backlog)}</td></tr>`;
      html += `<div>${t("ml_bt", bt.from)}</div><table class="hist ml"><thead><tr><th>${t("col_cluster")}</th><th>${t("th_ml_use")}</th>
        <th>${t("th_ml_samples")}</th><th>${t("th_ml_model")}</th><th>${t("th_ml_hist")}</th><th>${t("th_ml_slurm")}</th><th>${t("th_ml_bl")}</th></tr></thead>
        <tbody>${Object.entries(bt.clusters).map(([c, b]) => row(c, b, meta.clusters[c])).join("")}${row(t("all_short"), bt.all, null)}</tbody></table>`;
    }
    const hist = (meta.history || []).slice(-6).filter(h => h.model);
    if (hist.length > 1) html += `<div class="muted">${t("ml_trend", hist.map(h => `${fmtTime(h.trained_at).slice(0, 5)} ${pct(h.model.hit)}`).join(" → "))}</div>`;
  }
  if (m.error) html += `<div class="card-err">${esc(tr(m.error))}</div>`;
  st.innerHTML = html;
  const csel = document.getElementById("mlCluster");
  const clusters = ((lastData && lastData.clusters) || []).map(c => c.name);
  csel.innerHTML = `<option value="">${t("all_clusters")}</option>` + clusters.map(n => `<option value="${esc(n)}">${esc(n)}</option>`).join("");
  csel.value = clusters.includes(mlForm.cluster) ? mlForm.cluster : "";
  for (const [id, k] of [["mlCpus", "cpus"], ["mlGpus", "gpus"], ["mlNodes", "nodes"], ["mlTime", "time_h"]]){
    const el = document.getElementById(id);
    if (document.activeElement !== el) el.value = mlForm[k];
  }
  document.querySelector("#mlForm button").disabled = !meta;
  renderSuggest();
}

function renderRec(){
  const rec = document.getElementById("mlRec"), best = document.getElementById("mlBest");
  const ok = (mlItems || []).filter(c => c.n_seen >= 3);
  const name = c => `${esc(c.cluster)} ${esc(c.qos)}/${esc(c.partition)} ~${fmtH(c.wait[1])}${c.stale ? t("al_stale") : ""}`;
  rec.innerHTML = !mlItems ? "" : ok.length ? t("ml_rec", t("ml_rec_form", mlForm), name(ok[0]), ok[1] ? name(ok[1]) : "") : `<span class="muted">${t("ml_rec_none")}</span>`;
  const per = [];
  for (const c of ok) if (!per.some(x => x.cluster === c.cluster)) per.push(c);
  best.innerHTML = per.length > 1 ? `<span class="muted">${t("ml_best_title")}</span>` + per.map(c =>
    `<span class="c">${esc(c.cluster)}: ${esc(c.qos)}/${esc(c.partition)} <span class="${hCls(c.wait[1])}">${fmtH(c.wait[1])}</span><span class="muted"> (${fmtH(c.wait[0])} – ${fmtH(c.wait[2])})</span></span>`).join("") : "";
}

function renderSuggest(){
  renderRec();
  const el = document.getElementById("mlResult");
  if (mlErr){ el.innerHTML = `<div class="card-err">${esc(tr(mlErr))}</div>`; return; }
  if (!mlItems){ el.innerHTML = ""; return; }
  if (!mlItems.length){ el.innerHTML = `<div class="empty">${t("ml_no_fit")}</div>`; return; }
  const now = Date.now();
  const at = h => { const d = new Date(now + h * 3600e3); const p = x => String(x).padStart(2, "0"); return `${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; };
  const rows = mlItems.map((c, i) => {
    const [w20, w50, w80] = c.wait;
    const few = c.n_seen < 3;
    return `<tr class="${i === 0 && !few ? "best" : ""}"><td>${esc(c.cluster)}${c.stale ? ` <span class="tag subfull">${t("al_stale")}</span>` : ""}</td>
      <td>${esc(c.qos)}</td><td>${esc(c.partition)}</td>
      <td><span class="${hCls(w50)}">${fmtH(w50)}</span><span class="rng">${fmtH(w20)} – ${fmtH(w80)}</span>${i === 0 && !few ? ` <span class="tag cfg">${t("ml_best")}</span>` : ""}</td>
      <td>${at(w50)}</td>
      <td>${c.all_pending === null || c.all_pending === undefined ? `<span class="n-0">—</span>` : c.all_pending}</td>
      <td>${pairCell(c, "mine")}</td>
      <td>${c.backlog ? fmtRange(c.backlog[0], c.backlog[1]) : `<span class="n-0">—</span>`}</td>
      <td title="${esc(t("ml_n_tip"))}">${c.n_seen}${few ? ` <span class="tag full">${t("ml_few")}</span>` : ""}</td></tr>`;
  }).join("");
  el.innerHTML = `<table class="hist ml"><thead><tr><th>${t("col_cluster")}</th><th>QoS</th><th>${t("col_partition")}</th>
    <th>${t("th_ml_wait")}</th><th>${t("th_ml_start")}</th><th>${t("th_ml_pd")}</th><th>${t("th_ml_mine")}</th><th>${t("w_backlog")}</th><th>${t("th_ml_n")}</th></tr></thead>
    <tbody>${rows}</tbody></table>`;
}

async function runSuggest(){
  try{
    const res = await (await fetch("api/model/suggest", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(mlForm)})).json();
    mlErr = res.ok ? null : res.error; mlItems = res.ok ? res.items : null;
  }catch(e){ mlErr = String(e); }
  renderSuggest();
}
document.getElementById("mlForm").addEventListener("submit", e => {
  e.preventDefault();
  const v = id => document.getElementById(id).value;
  mlForm = {cluster: v("mlCluster"), cpus: +v("mlCpus") || 1, gpus: +v("mlGpus") || 0, nodes: +v("mlNodes") || 1, time_h: +v("mlTime") || 0};
  savePref("mlForm", mlForm);
  runSuggest();
});
document.getElementById("mlToggle").addEventListener("click", () => { mlCollapsed = !mlCollapsed; savePref("mlCollapsed", mlCollapsed); renderModel(); });
document.getElementById("mlTrain").addEventListener("click", async () => {
  document.getElementById("mlTrain").disabled = true;
  try{ await fetch("api/model/train", {method: "POST"}); }catch(e){}
  kick();
});

// ---------------- 排队历史 ----------------
let histCollapsed = loadPref("histCollapsed", true);
let hist = Object.assign({days: "30", cluster: "", qos: ""}, loadPref("hist", {}), {search: ""});
let histData = null, histSeq = 0, histFor = null;
const fmtWait = h => h === null || h === undefined ? `<span class="n-0">—</span>` : `<span class="${hCls(h)}">${fmtH(h)}</span>`;

async function loadHistory(){
  if (histCollapsed) return;
  const seq = ++histSeq;
  const qs = new URLSearchParams({days: hist.days, cluster: hist.cluster, qos: hist.qos, q: hist.search});
  try{
    const data = await (await fetch("api/history?" + qs)).json();
    if (seq !== histSeq) return;  // 已经有更新的请求了
    histData = data; histFor = lastData && lastData.updated_at;
  }catch(e){ return; }
  renderHistory();
}

function renderHistory(){
  document.getElementById("histWrap").style.display = histCollapsed ? "none" : "";
  document.getElementById("histToggle").textContent = histCollapsed ? t("expand") : t("collapse");
  if (histCollapsed) return;
  const csel = document.getElementById("histCluster");
  const clusters = ((lastData && lastData.clusters) || []).map(c => c.name);
  if (hist.cluster && !clusters.includes(hist.cluster)) clusters.push(hist.cluster);
  csel.innerHTML = `<option value="">${t("all_clusters")}</option>` + clusters.map(n => `<option value="${esc(n)}">${esc(n)}</option>`).join("");
  csel.value = hist.cluster;
  document.getElementById("histDays").value = hist.days;
  const statsEl = document.getElementById("histStats"), jobsEl = document.getElementById("histJobs");
  const d = histData;
  if (!d){ statsEl.innerHTML = `<div class="empty">${t("hist_loading")}</div>`; jobsEl.innerHTML = ""; return; }
  if (!d.ok){ statsEl.innerHTML = `<div class="card-err">${esc(tr(d.error))}</div>`; jobsEl.innerHTML = ""; return; }
  document.getElementById("histBackup").textContent = t("hist_backup",
    d.last_backup ? new Date(d.last_backup).toLocaleString([], {year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit"}) : "",
    d.n_backups, d.backup_days);
  const n = v => v ? v : `<span class="n-0">0</span>`;
  const srows = d.stats.map(s => {
    const key = s.cluster + "|" + s.qos;
    return `<tr class="${hist.qos && hist.qos === key ? "sel" : ""}" data-hq="${esc(key)}">
      <td>${esc(s.cluster)}</td><td>${esc(s.qos || "-")}</td><td>${n(s.started)}</td>
      <td>${fmtWait(s.median)}</td>
      <td>${s.p25 === null ? fmtWait(null) : `${fmtWait(s.p25)} – ${fmtWait(s.p75)}`}</td>
      <td>${fmtWait(s.p90)}</td><td>${fmtWait(s.max)}</td>
      <td>${s.pending ? `<span class="n-pd">${s.pending}</span>` : n(0)}</td><td>${n(s.no_start)}</td></tr>`;
  }).join("");
  statsEl.innerHTML = `<table class="hist stats"><thead><tr><th>${t("col_cluster")}</th><th>QoS</th><th>${t("th_started")}</th>
    <th>${t("th_median")}</th><th>${t("th_iqr")}</th><th>${t("th_p90")}</th><th>${t("th_max")}</th>
    <th>${t("th_still_pd")}</th><th>${t("th_no_start")}</th></tr></thead>
    <tbody>${srows || `<tr><td colspan="9" class="empty">${t("hist_none")}</td></tr>`}</tbody></table>`;
  const res = j => `${esc(j.cpus || "?")}C${j.gpus && j.gpus !== "0" ? ` / ${esc(j.gpus)}G${j.gpu_type ? " " + esc(j.gpu_type) : ""}` : ""}`;
  const wait = j => {
    const tip = t("wait_tip", j.wait_h === null ? "-" : fmtH(j.wait_h), j.wait_submit_h === null ? "-" : fmtH(j.wait_submit_h));
    if (j.wait_h === null) return `<span class="n-0">—</span>`;
    return j.censored ? `<span class="muted" title="${esc(t("wait_censored") + "\n" + tip)}">≥ ${fmtH(j.wait_h)}</span>`
                      : `<span title="${esc(tip)}">${fmtWait(j.wait_h)}</span>`;
  };
  const jrows = d.jobs.map(j => `<tr>
      <td>${esc(j.cluster)}</td><td class="jid" data-copy="${esc(j.jobid)}" title="${t("click_copy")}">${esc(j.jobid)}</td>
      <td class="name" title="${esc(j.name)}">${esc(j.name)}</td><td>${j.state ? stBadge(j.state) : ""}</td>
      <td>${esc(j.qos || "-")}</td><td class="part" title="${esc(j.partition)}">${esc(j.partition || "-")}</td>
      <td>${res(j)}</td><td>${fmtTime(j.submit)}</td><td>${fmtTime(j.start)}</td><td>${fmtTime(j.end)}</td>
      <td>${wait(j)}</td></tr>`).join("");
  jobsEl.innerHTML = `<table class="hist"><thead><tr><th>${t("col_cluster")}</th><th>Job ID</th><th>${t("col_name")}</th>
    <th>${t("col_state")}</th><th>QoS</th><th>${t("col_partition")}</th><th>${t("th_res2")}</th>
    <th>${t("th_submit")}</th><th>${t("th_start")}</th><th>${t("th_end")}</th><th>${t("th_wait")}</th></tr></thead>
    <tbody>${jrows || `<tr><td colspan="11" class="empty">${t("hist_none")}</td></tr>`}</tbody></table>`
    + (d.total > d.jobs.length ? `<div class="more">${t("hist_more", d.total, d.jobs.length)}</div>` : "");
}

function setHist(k, v){
  hist[k] = v;
  savePref("hist", {days: hist.days, cluster: hist.cluster, qos: hist.qos});
  loadHistory();
}
document.getElementById("histToggle").addEventListener("click", () => {
  histCollapsed = !histCollapsed; savePref("histCollapsed", histCollapsed);
  renderHistory(); loadHistory();
});
document.getElementById("histDays").addEventListener("change", e => setHist("days", e.target.value));
document.getElementById("histCluster").addEventListener("change", e => setHist("cluster", e.target.value));
let histSearchTimer = null;
document.getElementById("histSearch").addEventListener("input", e => {
  clearTimeout(histSearchTimer);
  histSearchTimer = setTimeout(() => setHist("search", e.target.value.trim()), 300);
});
document.getElementById("histStats").addEventListener("click", e => {
  const row = e.target.closest("tr[data-hq]");
  if (row) setHist("qos", hist.qos === row.dataset.hq ? "" : row.dataset.hq);
});
document.getElementById("histJobs").addEventListener("click", e => {
  const copy = e.target.closest("[data-copy]");
  if (copy) copyText(copy.dataset.copy).then(() => toast(t("copied", copy.dataset.copy)));
});

// ---------------- 交互 ----------------
function toast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg; el.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove("show"), 1200);
}
function copyText(s){
  if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(s);
  const ta = document.createElement("textarea"); ta.value = s; document.body.appendChild(ta);
  ta.select(); try{ document.execCommand("copy"); } finally { ta.remove(); }
  return Promise.resolve();
}
function jumpTo(key){
  const gk = groupOfJob[key];
  if (!gk && !document.getElementById("row-" + key)){ toast(t("not_in_list")); return; }
  if (gk && !expanded.has(gk)){ expanded.add(gk); savePref("expanded", [...expanded]); renderJobs(); }
  const row = document.getElementById("row-" + key) || document.querySelector(`tr[data-group="${CSS.escape(gk)}"]`);
  if (!row) return;
  row.scrollIntoView({block:"center", behavior:"smooth"});
  row.classList.remove("flash"); void row.offsetWidth; row.classList.add("flash");
}

document.getElementById("jobsBody").addEventListener("click", e => {
  const copy = e.target.closest("[data-copy]");
  if (copy){ copyText(copy.dataset.copy).then(() => toast(t("copied", copy.dataset.copy))); return; }
  const dep = e.target.closest("[data-jump]");
  if (dep){ jumpTo(dep.dataset.jump); return; }
  const tg = e.target.closest("[data-insp-toggle]");
  if (tg){ const k = tg.dataset.inspToggle; detailOpen.has(k) ? detailOpen.delete(k) : detailOpen.add(k); renderJobs(); return; }
  const rl = e.target.closest("[data-insp-reload]");
  if (rl){ rl.disabled = true; rl.textContent = t("reading"); requestInspect([rl.dataset.inspReload], true); return; }
  if (e.target.closest("tr.detail")) return;
  const grp = e.target.closest("tr.grp");
  if (grp){
    const k = grp.dataset.group;
    expanded.has(k) ? expanded.delete(k) : expanded.add(k);
    savePref("expanded", [...expanded]); renderJobs();
  }
});
document.getElementById("clusterFilter").addEventListener("change", e => setFilter("cluster", e.target.value));
document.getElementById("qosFilter").addEventListener("change", e => setFilter("qos", e.target.value));
document.getElementById("stateFilter").addEventListener("change", e => setFilter("state", e.target.value));
document.getElementById("searchBox").addEventListener("input", e => { filters.search = e.target.value.trim(); renderJobs(); });
document.getElementById("expandAll").addEventListener("click", () => {
  buildGroups(lastData.jobs).filter(groupVisible).forEach(g => { if (g.jobs.length > 1) expanded.add(g.key); });
  savePref("expanded", [...expanded]); renderJobs();
});
document.getElementById("collapseAll").addEventListener("click", () => { expanded.clear(); savePref("expanded", []); renderJobs(); });
document.getElementById("refreshBtn").addEventListener("click", async () => {
  const btn = document.getElementById("refreshBtn");
  btn.disabled = true; btn.textContent = t("queued_btn");
  try{ await fetch("api/refresh", {method: "POST"}); }catch(e){}
  kick();
});
document.getElementById("langBtn").addEventListener("click", () => {
  lang = lang === "zh" ? "en" : "zh";
  savePref("lang", lang);
  applyStatic();
  render();
  renderHistory();
  if (lastProgress) renderProgress(lastProgress);
});

// ---------------- 和后台同步 ----------------
// 页面只读本机 Flask 里的结果，不等 SSH：每隔一会儿问一下 /api/status（很轻），
// 版本号变了才重新拉 /api/jobs。后台忙的时候问得勤一点，好让进度条动起来。
let version = -1, tickTimer = null, busy = false, lastProgress = null;

function renderProgress(pr){
  lastProgress = pr;
  busy = pr.busy;
  const bar = document.getElementById("progBar"), wrap = document.getElementById("prog");
  wrap.classList.toggle("busy", pr.busy);
  bar.classList.toggle("indet", pr.busy && !pr.total);
  bar.style.width = pr.busy && pr.total ? Math.max(4, 100 * pr.done / pr.total) + "%" : (pr.busy ? "" : "0");
  bar.style.marginLeft = "";
  document.getElementById("progText").textContent = pr.busy
    ? `${t("bg")}${tr(pr.label) || t("bg_working")}${pr.total ? t("bg_steps", pr.done, pr.total) : ""}${pr.queued ? t("bg_more", pr.queued) : ""}`
    : "";
  const btn = document.getElementById("refreshBtn");
  btn.disabled = pr.refresh_queued;
  btn.textContent = pr.refresh_queued ? t("refreshing") : t("refresh");
}

async function loadJobs(){
  const res = await fetch("api/jobs");
  lastData = await res.json();
  version = lastData.version;
  render();
  // 刷新之后 jobs.csv 变了，重新拉一次历史
  if (!histCollapsed && lastData.updated_at !== histFor) loadHistory();
  renderProgress(lastData.progress);
}

async function tick(){
  clearTimeout(tickTimer);
  try{
    const st = await (await fetch("api/status")).json();
    renderProgress(st.progress);
    if (st.version !== version) await loadJobs();
  }catch(e){
    document.getElementById("progText").textContent = t("server_down");
  }
  tickTimer = setTimeout(tick, busy ? 700 : 3000);
}
function kick(){ clearTimeout(tickTimer); tickTimer = setTimeout(tick, 150); }

applyStatic();
renderFilters();
renderUpdated();
renderHistory();
tick();
</script>
